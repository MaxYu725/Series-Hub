name: Phase10C market selector one-shot

on:
  push:
    branches:
      - phase10c-market-selector

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase10c-market-selector
          fetch-depth: 0

      - name: Normalize temporary patch script
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/scripts/phase10c-apply.mjs')
          text = path.read_text()
          text = text.replace('${marketWhere}', '\\${marketWhere}')
          text = text.replace(
              '  if (count !== 1) throw new Error(`${path}: ${label} anchor count ${count}`);',
              '  if (count < 1) throw new Error(`${path}: ${label} anchor missing`);'
          )
          path.write_text(text)

      - name: Apply Phase 10C market selector patch
        run: node .github/scripts/phase10c-apply.mjs

      - name: Commit Phase 10C core changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase10c-market-selector-one-shot.yml .github/scripts/phase10c-apply.mjs
          git add src/index.js src/phase6-worker.js src/phase8-catalog.js src/phase8-discovery.js src/phase8-browse.js public/index.html public/app.js public/phase8-ui.js public/global-search.js
          git commit -m "Add Phase 10C US Korea catalog selector"
          git push origin HEAD:phase10c-market-selector
