name: Phase 7D branch authoring

on:
  push:
    branches:
      - phase7d-catalog-convergence

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Phase 7D branch
        uses: actions/checkout@v4
        with:
          ref: phase7d-catalog-convergence

      - name: Apply Phase 7D convergence patch
        run: python3 tools/phase7d-author.py

      - name: Commit Phase 7D changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MaxYu725"
          git config user.email "maxyu0725@outlook.com"
          git add -A
          git commit -m "Phase 7D: accelerate catalog convergence"
          git push origin HEAD:phase7d-catalog-convergence
