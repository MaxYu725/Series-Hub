name: Phase10C test diagnostic

on:
  push:
    branches:
      - phase10c-market-selector

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase10c-market-selector
          fetch-depth: 0

      - name: Capture exact unit-test failure
        shell: bash
        run: |
          set +e
          npm test > phase10c-test-failure.txt 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> phase10c-test-failure.txt
          exit 0

      - name: Commit diagnostic output and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase10c-test-diagnostic.yml
          git add phase10c-test-failure.txt
          git commit -m "Capture Phase 10C unit-test failure"
          git push origin HEAD:phase10c-market-selector
