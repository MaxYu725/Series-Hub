name: Phase 10E TMDB status probe

on:
  push:
    branches:
      - diagnostic/phase10e-coverage-baseline

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TMDB_API_TOKEN: ${{ secrets.TMDB_API }}
    steps:
      - name: Probe discover with_status semantics
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = process.env.TMDB_API_TOKEN;
          if (!token) throw new Error('TMDB_API secret missing');
          const auth = { accept: 'application/json', authorization: `Bearer ${token}` };
          const common = {
            include_adult: 'false', language: 'en-US', page: '1', sort_by: 'popularity.desc',
            with_origin_country: 'KR', with_type: '2|4',
            without_genres: '16|99|10762|10763|10764|10767'
          };
          async function get(path, params={}) {
            const url = new URL(`https://api.themoviedb.org/3${path}`);
            for (const [k,v] of Object.entries(params)) url.searchParams.set(k,String(v));
            const r = await fetch(url,{headers:auth});
            if (!r.ok) throw new Error(`${r.status} ${url}: ${(await r.text()).slice(0,200)}`);
            return r.json();
          }
          const rows = [];
          for (const status of ['0','1','2','3','4','5']) {
            const d = await get('/discover/tv',{...common,with_status:status});
            const sample = (d.results||[]).slice(0,3);
            const details = await Promise.all(sample.map(x=>get(`/tv/${x.id}`,{language:'en-US'})));
            rows.push({filter:status,totalResults:d.total_results,sample:details.map(x=>({id:x.id,name:x.name,status:x.status,type:x.type,first_air_date:x.first_air_date}))});
          }
          const active = await get('/discover/tv',{...common,with_status:'0|1|2|5'});
          console.log('PHASE10E_STATUS_PROBE=' + JSON.stringify({rows,activeFilter:{filter:'0|1|2|5',totalResults:active.total_results,firstPage:(active.results||[]).map(x=>({id:x.id,name:x.name}))}},null,2));
          NODE
