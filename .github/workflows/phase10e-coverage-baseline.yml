name: Phase 10E Korean coverage baseline

on:
  push:
    branches:
      - diagnostic/phase10e-coverage-baseline

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TMDB_API_TOKEN: ${{ secrets.TMDB_API }}
      PRODUCTION_URL: https://series-hub.max-yu-jp.workers.dev

    steps:
      - uses: actions/checkout@v4

      - name: Validate TMDB secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TMDB_API_TOKEN:-}" || { echo "TMDB_API secret is missing"; exit 1; }

      - name: Audit production and TMDB candidate coverage
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { isIncludedKoreanCatalogSeries } from './src/tmdb-korea-quality.js';
          import { normalizeLifecycle } from './src/tmdb.js';
          import { KOREA_NETWORK_SEEDS } from './src/tmdb-korea.js';

          const PROD = process.env.PRODUCTION_URL;
          const TOKEN = process.env.TMDB_API_TOKEN;
          const now = new Date();
          const activeStatuses = new Set(['airing', 'upcoming', 'planned']);
          const excludedGenreIds = [16, 99, 10762, 10763, 10764, 10767].join('|');
          const today = now.toISOString().slice(0, 10);
          const future = new Date(now.getTime());
          future.setUTCDate(future.getUTCDate() + 180);
          const future180 = future.toISOString().slice(0, 10);
          const recent = `${now.getUTCFullYear() - 6}-01-01`;

          async function json(url, options = {}) {
            const response = await fetch(url, options);
            if (!response.ok) throw new Error(`${response.status} ${url}: ${(await response.text()).slice(0, 300)}`);
            return response.json();
          }

          async function discover(page, extra = {}) {
            const url = new URL('https://api.themoviedb.org/3/discover/tv');
            const params = {
              include_adult: 'false',
              language: 'en-US',
              page: String(page),
              sort_by: 'popularity.desc',
              with_origin_country: 'KR',
              with_type: '2|4',
              without_genres: excludedGenreIds,
              ...extra
            };
            for (const [key, value] of Object.entries(params)) url.searchParams.set(key, value);
            return json(url, { headers: { accept: 'application/json', authorization: `Bearer ${TOKEN}` } });
          }

          async function details(id) {
            const url = new URL(`https://api.themoviedb.org/3/tv/${id}`);
            url.searchParams.set('language', 'en-US');
            return json(url, { headers: { accept: 'application/json', authorization: `Bearer ${TOKEN}` } });
          }

          const production = await json(`${PROD}/api/shows?market=KR&limit=100`);
          const current = Array.isArray(production.data) ? production.data : [];
          const existingIds = new Set(current.map((row) => Number(row.tmdb_id)).filter(Number.isFinite));
          const currentByStatus = current.reduce((acc, row) => {
            const key = row.status || 'unknown';
            acc[key] = (acc[key] || 0) + 1;
            return acc;
          }, {});

          const feeds = [];
          for (const page of [1, 2, 3]) {
            const result = await discover(page, { 'first_air_date.gte': recent });
            feeds.push({ kind: 'broad', label: `broad-p${page}`, results: result.results || [] });
          }
          for (const page of [1, 2, 3]) {
            const result = await discover(page, { 'air_date.gte': today, 'air_date.lte': future180 });
            feeds.push({ kind: 'schedule', label: `schedule-p${page}`, results: result.results || [] });
          }
          for (const seed of KOREA_NETWORK_SEEDS) {
            for (const page of [1, 2]) {
              const extra = { with_networks: String(seed.tmdbNetworkId) };
              if (seed.recentFirstAirYears) extra['first_air_date.gte'] = `${now.getUTCFullYear() - Number(seed.recentFirstAirYears)}-01-01`;
              const result = await discover(page, extra);
              feeds.push({ kind: 'network', label: `${seed.name}-p${page}`, results: result.results || [] });
            }
          }

          const candidates = new Map();
          for (const feed of feeds) {
            for (const item of feed.results) {
              const id = Number(item?.id);
              if (!Number.isInteger(id) || id <= 0) continue;
              if (!candidates.has(id)) {
                candidates.set(id, {
                  id,
                  name: item.name || item.original_name || `TMDB ${id}`,
                  popularity: Number(item.popularity || 0),
                  firstAirDate: item.first_air_date || null,
                  sources: new Set()
                });
              }
              candidates.get(id).sources.add(feed.label);
            }
          }

          const missing = [...candidates.values()]
            .filter((item) => !existingIds.has(item.id))
            .sort((a, b) => b.popularity - a.popularity)
            .slice(0, 120);

          const detailRows = [];
          for (let index = 0; index < missing.length; index += 8) {
            const batch = missing.slice(index, index + 8);
            const settled = await Promise.allSettled(batch.map((item) => details(item.id)));
            settled.forEach((result, offset) => {
              detailRows.push({ candidate: batch[offset], result });
            });
            await new Promise((resolve) => setTimeout(resolve, 120));
          }

          const eligibleMissing = [];
          const rejection = { qualityGate: 0, inactive: 0, fetchFailed: 0 };
          for (const row of detailRows) {
            if (row.result.status !== 'fulfilled') {
              rejection.fetchFailed += 1;
              continue;
            }
            const d = row.result.value;
            if (!isIncludedKoreanCatalogSeries(d)) {
              rejection.qualityGate += 1;
              continue;
            }
            const status = normalizeLifecycle(d, now).status;
            if (!activeStatuses.has(status)) {
              rejection.inactive += 1;
              continue;
            }
            eligibleMissing.push({
              id: Number(d.id),
              name: d.name || d.original_name,
              status,
              tmdbStatus: d.status || null,
              firstAirDate: d.first_air_date || null,
              nextAirDate: d.next_episode_to_air?.air_date || null,
              popularity: Number(d.popularity || 0),
              networks: (d.networks || []).map((n) => n.name).join(' · '),
              genres: (d.genres || []).map((g) => g.name).join(' · '),
              sources: [...row.candidate.sources]
            });
          }

          const eligibleByStatus = eligibleMissing.reduce((acc, row) => {
            acc[row.status] = (acc[row.status] || 0) + 1;
            return acc;
          }, {});
          const feedRows = feeds.reduce((sum, feed) => sum + feed.results.length, 0);
          const uniqueMissing = [...candidates.keys()].filter((id) => !existingIds.has(id)).length;
          const summary = {
            production: {
              krCatalogCount: current.length,
              byStatus: currentByStatus,
              tmdbIds: [...existingIds].sort((a, b) => a - b)
            },
            audit: {
              discoveryRequests: feeds.length,
              feedRows,
              uniqueCandidates: candidates.size,
              uniqueMissingCandidates: uniqueMissing,
              detailsAudited: detailRows.length,
              eligibleMissingInAuditedTop120: eligibleMissing.length,
              eligibleMissingByStatus: eligibleByStatus,
              rejected: rejection
            },
            topEligibleMissing: eligibleMissing
              .sort((a, b) => b.popularity - a.popularity)
              .slice(0, 40)
          };

          console.log('PHASE10E_BASELINE=' + JSON.stringify(summary, null, 2));

          const fs = await import('node:fs');
          const lines = [
            '## Phase 10E Korean catalog coverage baseline',
            '',
            `- Production KR catalog: ${current.length}`,
            `- Discovery requests in audit: ${feeds.length}`,
            `- Unique candidates across sampled pages: ${candidates.size}`,
            `- Unique candidates not in production: ${uniqueMissing}`,
            `- Missing candidates detail-audited: ${detailRows.length}`,
            `- Existing-quality-gate eligible active shows missing from production: ${eligibleMissing.length}`,
            `- Eligible missing by status: ${JSON.stringify(eligibleByStatus)}`,
            '',
            '### Top eligible missing',
            ...eligibleMissing.slice(0, 30).map((row) => `- ${row.name} (TMDB ${row.id}) — ${row.status} — ${row.networks || 'network n/a'}`)
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE
