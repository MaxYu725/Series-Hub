name: Prepare Phase 5E-C acceptance checkpoint

on:
  push:
    branches:
      - phase-5e-c-acceptance-checkpoint
    paths:
      - .github/workflows/phase5e-c-checkpoint-writer.yml

permissions:
  contents: write

jobs:
  write-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout checkpoint branch
        uses: actions/checkout@v4
        with:
          ref: phase-5e-c-acceptance-checkpoint

      - name: Update README and Phase 5E checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          readme_path = Path('README.md')
          text = readme_path.read_text()

          def replace_once(old, new):
              global text
              if old not in text:
                  raise SystemExit(f'missing README anchor: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '**Phase 5D-C — targeted background episode reminders: COMPLETE and production-accepted.**',
              '**Phase 5E-C — US-series maturity hardening: COMPLETE and production-accepted.**'
          )

          replace_once(
              '- Phase 5D-C — hourly targeted `episode_24h` Web Push reminders with deduplication, stale-subscription cleanup and real production-device acceptance.\n',
              '- Phase 5D-C — hourly targeted `episode_24h` Web Push reminders with deduplication, stale-subscription cleanup and real production-device acceptance;\n'
              '- Phase 5E-A — production maturity baseline across catalog, mapping, episodes, regional titles and Push health;\n'
              '- Phase 5E-B — rotating TMDB discovery slices so the fixed 48-request budget reaches substantially more eligible US-series candidates;\n'
              '- Phase 5E-C — hourly bounded TVmaze convergence, scaled production smoke validation and regional-title fallback acceptance.\n'
          )

          replace_once(
              '**Next recommended phase: Phase 5E — US-series maturity / hardening checkpoint.**\n\nDo not immediately broaden notification types or introduce accounts. First harden catalog/schedule coverage, regional-title quality, lifecycle consistency, mobile UX and notification observability. Phase 6 geographic expansion should follow only after the US-series baseline is judged mature.',
              '**Next recommended phase: Phase 5E-D — lifecycle consistency, mobile UX and observability closeout.**\n\nDo not broaden notification types, introduce accounts or begin non-US expansion yet. Phase 5E-D should close the remaining US-series maturity items—official lifecycle consistency across the enlarged catalog, mobile interaction/loading resilience and operational observability—before deciding whether the Phase 5 maturity gate is complete enough for Phase 6 geographic expansion.'
          )

          phase5d_end = '''- final read-only audit recorded 1 successful `episode_24h` delivery, 0 pending transient failures and 0 terminal failures;\n- the active accountless subscription and show mappings remained healthy after delivery.\n\nProduction-network audits remain separate from the default unit-test suite. Audit-only PR code is closed without merge.'''
          phase5e_section = '''- final read-only audit recorded 1 successful `episode_24h` delivery, 0 pending transient failures and 0 terminal failures;\n- the active accountless subscription and show mappings remained healthy after delivery.\n\n### Phase 5E-A–5E-C\n\nProduction maturity hardening proved:\n\n- Phase 5E-A established the production baseline and identified catalog breadth, not episode timestamp quality or Push delivery, as the first systemic bottleneck;\n- Phase 5E-B kept the fixed TMDB request ceiling while rotating page-one candidate slices, expanding the active US-series catalog from 34 to 67 and later 71 shows;\n- Phase 5E-C changed the bounded 10-show TVmaze enrichment pass from every six hours to every hour without changing the 10-show per-invocation cap;\n- final acceptance measured **71/71 active shows with exact TVmaze mapping**, zero unsynced active shows, oldest TVmaze sync age **7.49h** and average age **3.55h**;\n- all **279/279 retained numbered TVmaze episodes** had precise `air_timestamp` values;\n- the last eight hours contained **8 TVmaze sync runs**, with **0 failed** and **0 warning** runs, and the latest run was approximately **0.49h** old;\n- notification delivery remained healthy after the hardening change: **1 sent**, **0 transient failures**, **0 terminal failures**, **0 stuck sending** records since the Phase 5E-C deployment boundary;\n- regional title display remained complete for active shows: HK-specific **67/71**, with fallback available for all remaining 4 and **0 active shows without any Chinese preferred title**;\n- production/PR smoke validation was changed to use temporary files for large API payloads so catalog growth no longer hits the process environment-size limit.\n\nSee [`docs/PHASE5E_HARDENING.md`](docs/PHASE5E_HARDENING.md) for the Phase 5E baseline, implementation decisions and final acceptance gate.\n\nProduction-network audits remain separate from the default unit-test suite. Audit-only code is not merged into `main`.'''
          replace_once(phase5d_end, phase5e_section)

          replace_once(
              '                         │       ├── Catalog/schedule sync\n',
              '                         │       ├── Catalog sync + hourly TVmaze convergence\n'
          )

          replace_once(
              '- TVmaze: minute 47 every six hours;',
              '- TVmaze: minute 47 every hour;'
          )

          replace_once(
              '│   ├── PHASE4_LIFECYCLE.md\n│   └── PHASE5D_NOTIFICATIONS.md',
              '│   ├── PHASE4_LIFECYCLE.md\n│   ├── PHASE5D_NOTIFICATIONS.md\n│   └── PHASE5E_HARDENING.md'
          )

          replace_once(
              '│   ├── phase4-worker.js\n│   ├── lifecycle.js',
              '│   ├── phase4-worker.js\n│   ├── phase5e-worker.js\n│   ├── lifecycle.js'
          )

          replace_once(
              '- **Phase 5D-D — Deferred/optional:** renewal/final-season Push alerts, per-show notification-type controls or queue/batching if later justified.\n- **Phase 5E — Recommended next:** US-series maturity/hardening audit before geographic expansion.\n- **Phase 6 — Later:** expansion beyond US series after the maturity gate passes.',
              '- **Phase 5D-D — Deferred/optional:** renewal/final-season Push alerts, per-show notification-type controls or queue/batching if later justified.\n- **Phase 5E-A — Complete:** production maturity baseline and bottleneck identification.\n- **Phase 5E-B — Complete:** rotating TMDB discovery slices within the existing request budget; production catalog breadth acceptance passed.\n- **Phase 5E-C — Complete:** hourly bounded TVmaze convergence, regional-title fallback audit, CI/runtime smoke scaling and production acceptance.\n- **Phase 5E-D — Recommended next:** lifecycle consistency, mobile UX and observability closeout for the enlarged US catalog.\n- **Phase 6 — Later:** expansion beyond US series only after the full Phase 5 maturity gate is closed.'
          )

          replace_once(
              'As of the Phase 5D-C production acceptance, **do not rebuild Phase 4, replace local tracking/viewing states with accounts, rotate VAPID keys casually, or broaden notification types by default**.',
              'As of the Phase 5E-C production acceptance, **do not rebuild Phase 4, replace local tracking/viewing states with accounts, rotate VAPID keys casually, broaden notification types by default, or undo the fixed-budget catalog/convergence controls without new measurements**.'
          )

          replace_once(
              '- exact TVmaze episode/schedule linkage;\n',
              '- exact TVmaze episode/schedule linkage with bounded hourly convergence;\n'
          )

          replace_once(
              'The safest next step is **Phase 5E: measure and harden the current US-series product**—especially catalog/schedule completeness, title/lifecycle quality, mobile stability and notification reliability—before adding broader alerts, accounts or non-US catalog scope.',
              'The safest next step is **Phase 5E-D: close the remaining US-series maturity items**—official lifecycle consistency across the enlarged catalog, mobile stability/interaction resilience and production observability—before deciding whether Phase 6 non-US expansion is justified.'
          )

          readme_path.write_text(text)

          Path('docs/PHASE5E_HARDENING.md').write_text('''# Phase 5E — US-series maturity / hardening\n\n## Purpose\n\nPhase 5E hardens the accepted US-series product before any geographic expansion or broader notification scope. It does not introduce accounts and it does not change the accepted local-first personalization boundary.\n\n## Phase 5E-A — maturity baseline\n\nThe first production audit measured the end-to-end catalog, mapping, episode, title and notification state. The important finding was that episode timestamp quality and Push delivery were already strong, while TMDB catalog breadth was constrained by repeatedly starting the fixed detail budget from the same front portion of discovery feeds.\n\nBaseline highlights before the breadth repair:\n\n- active US scripted shows: 34;\n- exact TVmaze mapping: 34/34;\n- retained numbered episodes: 164;\n- precise episode timestamps: 164/164;\n- HK preferred titles: 32/34;\n- the TMDB sync saw roughly 131 candidates but could detail only 40 per invocation under the accepted request budget.\n\n## Phase 5E-B — fixed-budget catalog rotation\n\nThe TMDB discovery/detail ceiling remains unchanged at 48 requests per sync: 8 discovery requests plus at most 40 detail requests. Instead of always starting from the front of each discovery feed, six-hour sync slots rotate the page-one candidate slice while preserving round-robin feed representation, de-duplication, scripted-US filtering and network policy.\n\nProduction acceptance showed the active catalog expand from 34 to 67 shows without increasing the request ceiling. This exposed TVmaze downstream convergence as the next bottleneck.\n\n## Phase 5E-C — hourly bounded TVmaze convergence\n\nThe TVmaze synchronizer still processes at most 10 shows per invocation. Phase 5E-C changes only its cadence: from minute 47 every six hours to minute 47 every hour. TMDB remains minute 17 every six hours and the `episode_24h` reminder runner remains minute 7 every hour.\n\nThis means a roughly 70-show active catalog can converge in about seven to eight hourly passes while preserving the existing per-run outbound-request safety bound.\n\nPhase 5E-C also hardened GitHub Actions validation after catalog growth exposed an operating-system environment-size failure. Production and PR smoke tests now save large API payloads to temporary files and let Node read those files, rather than copying full `/api/shows` and schedule payloads into process environment variables.\n\n## Regional-title decision\n\nPhase 5E-C did not silently promote TW/CN translations into HK-specific aliases. The existing resolver keeps HK/TW/CN provenance separate and uses regional fallback when an HK-specific preferred title is absent. Manual HK overrides still require HK-specific evidence.\n\n## Final production acceptance\n\nThe final read-only production audit ran after sustained hourly convergence and passed every gate:\n\n| Metric | Final result | Gate |\n| --- | ---: | --- |\n| Active catalog | 71 | no regression from Phase 5E-B |\n| Exact TVmaze mapping | 71/71 | 100% |\n| Active shows never TVmaze-synced | 0 | 0 |\n| Oldest active TVmaze sync age | 7.49h | approximately <= 8h |\n| Average active TVmaze sync age | 3.55h | informational |\n| Retained numbered TVmaze episodes | 279 | > 0 |\n| Precise `air_timestamp` coverage | 279/279 | 100% |\n| TVmaze runs in preceding 8h | 8 | >= 7 |\n| Failed TVmaze runs in preceding 8h | 0 | 0 |\n| Warning TVmaze runs in preceding 8h | 0 | 0 |\n| Latest TVmaze run age | 0.49h | <= 1.5h |\n| Notification deliveries since Phase 5E-C boundary | 1 sent | informational |\n| New transient notification failures | 0 | 0 |\n| New terminal notification failures | 0 | 0 |\n| Stuck `sending` deliveries | 0 | 0 |\n| HK-specific preferred titles | 67/71 | provenance-preserving |\n| HK gaps with TW/CN fallback | 4/4 | complete fallback |\n| Active shows with no Chinese preferred title | 0 | 0 |\n\nThe production runtime health endpoint and latest TVmaze sync status were also healthy, and the deployed cron contract was confirmed as:\n\n```text\n7 * * * *       episode_24h reminder\n17 */6 * * *   TMDB catalog sync\n47 * * * *      TVmaze episode/schedule convergence\n```\n\n## Acceptance decision\n\n**Phase 5E-C is COMPLETE and production-accepted.**\n\nThe hourly convergence model is keeping up with the enlarged catalog without raising the per-invocation TVmaze cap, episode timing remains fully precise for retained numbered TVmaze episodes, notification delivery has not regressed, and regional Chinese-title fallback remains complete without falsifying HK provenance.\n\n## Next recommended slice\n\n**Phase 5E-D — lifecycle consistency, mobile UX and observability closeout.**\n\nBefore Phase 6 geographic expansion, review the enlarged active catalog for official lifecycle-evidence consistency, exercise mobile loading/interaction resilience against the larger result set, and ensure operational signals make source-sync or notification degradation visible without relying on manual D1 audits.\n''')
          PY

      - name: Commit checkpoint files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/PHASE5E_HARDENING.md
          git diff --cached --check
          git commit -m "Document Phase 5E-C production acceptance"
          git push origin HEAD:phase-5e-c-acceptance-checkpoint
