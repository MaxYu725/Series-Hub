name: Phase10B1 core one-shot

on:
  push:
    branches:
      - phase10b1-korea-schedule-gap-priority

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase10b1-korea-schedule-gap-priority
          fetch-depth: 0

      - name: Apply bounded selector patch
        run: node scripts/phase10b1-patch.mjs

      - name: Commit core change and remove temporary patch files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase10b1-core-one-shot.yml scripts/phase10b1-patch.mjs
          git add src/tmdb-korea.js
          git commit -m "Prioritize Korean schedule gaps within detail budget"
          git push origin HEAD:phase10b1-korea-schedule-gap-priority
