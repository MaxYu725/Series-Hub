name: Phase 10E production acceptance

on:
  push:
    branches:
      - diagnostic/phase10e-production-acceptance

permissions:
  contents: read

env:
  PRODUCTION_URL: https://series-hub.max-yu-jp.workers.dev
  PRODUCTION_DB_NAME: series-hub-db
  WRANGLER_VERSION: "4.125.0"

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TMDB_API_TOKEN: ${{ secrets.TMDB_API }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate acceptance credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TMDB_API_TOKEN:-}" || { echo "TMDB_API secret is missing"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CF_API secret is missing"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CF_ID secret is missing"; exit 1; }

      - name: Capture production baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          SQL="SELECT
            (SELECT COUNT(*) FROM shows s WHERE (',' || COALESCE(s.origin_country, '') || ',') LIKE '%,KR,%' AND s.status IN ('airing','upcoming','planned')) AS kr_count,
            (SELECT COUNT(*) FROM episodes e JOIN seasons se ON se.id=e.season_id JOIN shows s ON s.id=se.show_id WHERE (',' || COALESCE(s.origin_country, '') || ',') LIKE '%,KR,%' AND e.tvmaze_id IS NOT NULL AND e.air_date >= date('now')) AS kr_future_tvmaze,
            (SELECT COUNT(*) FROM shows s WHERE (',' || COALESCE(s.origin_country, '') || ',') LIKE '%,KR,%' AND s.status IN ('airing','upcoming','planned') AND (s.series_type NOT IN ('Scripted','Miniseries') OR NOT EXISTS (SELECT 1 FROM show_genres sg JOIN genres g ON g.id=sg.genre_id WHERE sg.show_id=s.id AND g.tmdb_genre_id IN (18,35,37,80,9648,10751,10759,10765,10766,10768)))) AS invalid_quality,
            (SELECT COUNT(*) FROM episodes e JOIN seasons se ON se.id=e.season_id JOIN shows s ON s.id=se.show_id WHERE e.tvmaze_id IS NULL AND e.tmdb_id IS NOT NULL AND e.source_url LIKE 'https://www.themoviedb.org/tv/%' AND e.air_date >= date('now') AND (',' || COALESCE(s.origin_country, '') || ',') NOT LIKE '%,KR,%') AS non_kr_fallbacks;"
          SNAPSHOT="$(npx --yes wrangler@"${WRANGLER_VERSION}" d1 execute "${PRODUCTION_DB_NAME}" --remote --json --command "${SQL}")"
          printf '%s\n' "${SNAPSHOT}"
          BASE_COUNT="$(printf '%s' "${SNAPSHOT}" | jq -r '.. | objects | select(has("kr_count")) | .kr_count' | head -n 1)"
          BASE_TVMAZE="$(printf '%s' "${SNAPSHOT}" | jq -r '.. | objects | select(has("kr_future_tvmaze")) | .kr_future_tvmaze' | head -n 1)"
          INVALID="$(printf '%s' "${SNAPSHOT}" | jq -r '.. | objects | select(has("invalid_quality")) | .invalid_quality' | head -n 1)"
          NON_KR="$(printf '%s' "${SNAPSHOT}" | jq -r '.. | objects | select(has("non_kr_fallbacks")) | .non_kr_fallbacks' | head -n 1)"
          test -n "${BASE_COUNT}" && test -n "${BASE_TVMAZE}" && test -n "${INVALID}" && test -n "${NON_KR}"
          test "${INVALID}" -eq 0 || { echo "Baseline already contains ${INVALID} out-of-policy KR rows"; exit 1; }
          test "${NON_KR}" -eq 0 || { echo "Baseline has ${NON_KR} non-KR TMDB fallback rows"; exit 1; }
          echo "count=${BASE_COUNT}" >> "${GITHUB_OUTPUT}"
          echo "tvmaze=${BASE_TVMAZE}" >> "${GITHUB_OUTPUT}"
          echo "Baseline KR catalog=${BASE_COUNT}; future TVmaze=${BASE_TVMAZE}"

      - name: Derive protected sync key
        id: sync_key
        shell: bash
        run: |
          set -euo pipefail
          KEY="$(node -e '
            const crypto=require("crypto");
            process.stdout.write(crypto.createHash("sha256").update("series-hub:tmdb-sync:v2:"+process.env.TMDB_API_TOKEN).digest("hex"));
          ')"
          echo "::add-mask::${KEY}"
          echo "key=${KEY}" >> "${GITHUB_OUTPUT}"

      - name: Run three bounded Phase 10E Korean syncs
        id: kr_syncs
        env:
          SYNC_KEY: ${{ steps.sync_key.outputs.key }}
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/phase10e-syncs.jsonl
          TOTAL_CHANGED=0
          MAX_BUDGET=0
          MAX_SELECTED=0
          MAX_GAPS=0
          for pass in 1 2 3; do
            RESPONSE="$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 -X POST -H "x-series-hub-sync-key: ${SYNC_KEY}" "${PRODUCTION_URL}/api/internal/tmdb-sync-kr")"
            printf '%s\n' "KR pass ${pass}: ${RESPONSE}"
            METRICS="$(RESPONSE="${RESPONSE}" node -e '
              const p=JSON.parse(process.env.RESPONSE);
              const n=(v)=>Number(v||0);
              if(p.ok!==true) throw new Error("KR sync not ok");
              if(p.source!=="tmdb_kr" || p.market!=="KR") throw new Error("wrong source/market");
              if(p.coveragePolicy!=="bounded_gap_then_new_candidate_priority") throw new Error("10E coverage policy missing");
              if(n(p.externalRequestBudget)>24 || n(p.discoveryRequests)!==6 || n(p.recordsSelected)>18) throw new Error("request budget exceeded");
              if(n(p.scheduleGapCandidates)>4 || n(p.scheduleGapPriorityLimit)!==4) throw new Error("gap budget exceeded");
              if(n(p.discoveredCandidatePool)>60 || n(p.scheduleLookaheadDays)!==180) throw new Error("coverage bounds invalid");
              if(n(p.broadPage)<1 || n(p.broadPage)>3 || n(p.schedulePage)<1 || n(p.schedulePage)>3) throw new Error("page rotation invalid");
              process.stdout.write([n(p.recordsChanged),n(p.externalRequestBudget),n(p.recordsSelected),n(p.scheduleGapCandidates)].join(" "));
            ')"
            CHANGED="${METRICS%% *}"
            REST="${METRICS#* }"
            BUDGET="${REST%% *}"
            REST="${REST#* }"
            SELECTED="${REST%% *}"
            GAPS="${REST##* }"
            TOTAL_CHANGED=$((TOTAL_CHANGED + CHANGED))
            [ "${BUDGET}" -gt "${MAX_BUDGET}" ] && MAX_BUDGET="${BUDGET}"
            [ "${SELECTED}" -gt "${MAX_SELECTED}" ] && MAX_SELECTED="${SELECTED}"
            [ "${GAPS}" -gt "${MAX_GAPS}" ] && MAX_GAPS="${GAPS}"
            printf '%s\n' "${RESPONSE}" >> /tmp/phase10e-syncs.jsonl
            sleep 2
          done
          echo "total_changed=${TOTAL_CHANGED}" >> "${GITHUB_OUTPUT}"
          echo "max_budget=${MAX_BUDGET}" >> "${GITHUB_OUTPUT}"
          echo "max_selected=${MAX_SELECTED}" >> "${GITHUB_OUTPUT}"
          echo "max_gaps=${MAX_GAPS}" >> "${GITHUB_OUTPUT}"
          echo "Three KR passes changed ${TOTAL_CHANGED} accepted rows; max per-run budget=${MAX_BUDGET}; selected=${MAX_SELECTED}; gaps=${MAX_GAPS}"

      - name: Converge TVmaze mappings for newly admitted shows
        env:
          SYNC_KEY: ${{ steps.sync_key.outputs.key }}
        shell: bash
        run: |
          set -euo pipefail
          TOTAL_PROCESSED=0
          for pass in 1 2 3; do
            RESPONSE="$(curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors --retry-delay 3 -X POST -H "x-series-hub-sync-key: ${SYNC_KEY}" "${PRODUCTION_URL}/api/internal/tvmaze-sync")"
            printf '%s\n' "TVmaze pass ${pass}: ${RESPONSE}"
            PROCESSED="$(RESPONSE="${RESPONSE}" node -e 'const p=JSON.parse(process.env.RESPONSE); if(p.ok!==true) process.exit(1); process.stdout.write(String(Number(p.showsProcessed||0)));')"
            TOTAL_PROCESSED=$((TOTAL_PROCESSED + PROCESSED))
          done
          echo "TVmaze processed ${TOTAL_PROCESSED} show passes after KR convergence"

      - name: Verify production convergence and quality
        id: final
        env:
          BASE_COUNT: ${{ steps.baseline.outputs.count }}
          BASE_TVMAZE: ${{ steps.baseline.outputs.tvmaze }}
        shell: bash
        run: |
          set -euo pipefail
          SQL="SELECT
            (SELECT COUNT(*) FROM shows s WHERE (',' || COALESCE(s.origin_country, '') || ',') LIKE '%,KR,%' AND s.status IN ('airing','upcoming','planned')) AS kr_count,
            (SELECT COUNT(*) FROM episodes e JOIN seasons se ON se.id=e.season_id JOIN shows s ON s.id=se.show_id WHERE (',' || COALESCE(s.origin_country, '') || ',') LIKE '%,KR,%' AND e.tvmaze_id IS NOT NULL AND e.air_date >= date('now')) AS kr_future_tvmaze,
            (SELECT COUNT(*) FROM shows s WHERE (',' || COALESCE(s.origin_country, '') || ',') LIKE '%,KR,%' AND s.status IN ('airing','upcoming','planned') AND (s.series_type NOT IN ('Scripted','Miniseries') OR NOT EXISTS (SELECT 1 FROM show_genres sg JOIN genres g ON g.id=sg.genre_id WHERE sg.show_id=s.id AND g.tmdb_genre_id IN (18,35,37,80,9648,10751,10759,10765,10766,10768)))) AS invalid_quality,
            (SELECT COUNT(*) FROM episodes e JOIN seasons se ON se.id=e.season_id JOIN shows s ON s.id=se.show_id WHERE e.tvmaze_id IS NULL AND e.tmdb_id IS NOT NULL AND e.source_url LIKE 'https://www.themoviedb.org/tv/%' AND e.air_date >= date('now') AND (',' || COALESCE(s.origin_country, '') || ',') NOT LIKE '%,KR,%') AS non_kr_fallbacks,
            (SELECT COUNT(*) FROM shows s WHERE s.tmdb_id IN (314939,246473,294636,220074,126485,233347,235577,217553) AND (',' || COALESCE(s.origin_country, '') || ',') LIKE '%,KR,%' AND s.status IN ('airing','upcoming','planned')) AS benchmark_count;"
          SNAPSHOT="$(npx --yes wrangler@"${WRANGLER_VERSION}" d1 execute "${PRODUCTION_DB_NAME}" --remote --json --command "${SQL}")"
          printf '%s\n' "${SNAPSHOT}"
          COUNT="$(printf '%s' "${SNAPSHOT}" | jq -r '.. | objects | select(has("kr_count")) | .kr_count' | head -n 1)"
          TVMAZE="$(printf '%s' "${SNAPSHOT}" | jq -r '.. | objects | select(has("kr_future_tvmaze")) | .kr_future_tvmaze' | head -n 1)"
          INVALID="$(printf '%s' "${SNAPSHOT}" | jq -r '.. | objects | select(has("invalid_quality")) | .invalid_quality' | head -n 1)"
          NON_KR="$(printf '%s' "${SNAPSHOT}" | jq -r '.. | objects | select(has("non_kr_fallbacks")) | .non_kr_fallbacks' | head -n 1)"
          BENCH="$(printf '%s' "${SNAPSHOT}" | jq -r '.. | objects | select(has("benchmark_count")) | .benchmark_count' | head -n 1)"
          test -n "${COUNT}" && test -n "${TVMAZE}" && test -n "${INVALID}" && test -n "${NON_KR}" && test -n "${BENCH}"
          MIN_COUNT=$((BASE_COUNT + 5))
          test "${COUNT}" -ge "${MIN_COUNT}" || { echo "KR catalog growth insufficient: ${BASE_COUNT} -> ${COUNT}"; exit 1; }
          test "${INVALID}" -eq 0 || { echo "Found ${INVALID} out-of-policy KR rows"; exit 1; }
          test "${NON_KR}" -eq 0 || { echo "Found ${NON_KR} non-KR TMDB fallback rows"; exit 1; }
          test "${BENCH}" -ge 3 || { echo "Only ${BENCH} benchmark titles entered naturally"; exit 1; }
          test "${TVMAZE}" -ge "${BASE_TVMAZE}" || { echo "Future TVmaze ownership regressed: ${BASE_TVMAZE} -> ${TVMAZE}"; exit 1; }
          echo "count=${COUNT}" >> "${GITHUB_OUTPUT}"
          echo "tvmaze=${TVMAZE}" >> "${GITHUB_OUTPUT}"
          echo "benchmarks=${BENCH}" >> "${GITHUB_OUTPUT}"

          ROWS_SQL="SELECT tmdb_id, english_title, status, series_type FROM shows WHERE tmdb_id IN (314939,246473,294636,220074,126485,233347,235577,217553) AND (',' || COALESCE(origin_country, '') || ',') LIKE '%,KR,%' ORDER BY tmdb_id;"
          ROWS="$(npx --yes wrangler@"${WRANGLER_VERSION}" d1 execute "${PRODUCTION_DB_NAME}" --remote --json --command "${ROWS_SQL}")"
          printf '%s\n' "${ROWS}"

      - name: Verify public KR catalog and operational health
        shell: bash
        run: |
          set -euo pipefail
          CATALOG="$(curl --fail --silent --show-error "${PRODUCTION_URL}/api/shows?market=KR&limit=100")"
          KR_STATUS="$(curl --fail --silent --show-error "${PRODUCTION_URL}/api/sync-status?source=tmdb_kr")"
          OPS="$(curl --fail --silent --show-error "${PRODUCTION_URL}/api/ops-status")"
          CATALOG="${CATALOG}" KR_STATUS="${KR_STATUS}" OPS="${OPS}" node -e '
            const catalog=JSON.parse(process.env.CATALOG);
            const status=JSON.parse(process.env.KR_STATUS);
            const ops=JSON.parse(process.env.OPS);
            if(!Array.isArray(catalog.data) || catalog.data.length < 18) throw new Error("public KR catalog did not grow");
            if(!status.data || !["success","success_with_warnings"].includes(status.data.status)) throw new Error("tmdb_kr health is not successful");
            if(ops.ok!==true) throw new Error("ops health is not ok");
          '

      - name: Publish Phase 10E acceptance summary
        env:
          BASE_COUNT: ${{ steps.baseline.outputs.count }}
          FINAL_COUNT: ${{ steps.final.outputs.count }}
          BASE_TVMAZE: ${{ steps.baseline.outputs.tvmaze }}
          FINAL_TVMAZE: ${{ steps.final.outputs.tvmaze }}
          BENCHMARKS: ${{ steps.final.outputs.benchmarks }}
          TOTAL_CHANGED: ${{ steps.kr_syncs.outputs.total_changed }}
          MAX_BUDGET: ${{ steps.kr_syncs.outputs.max_budget }}
          MAX_SELECTED: ${{ steps.kr_syncs.outputs.max_selected }}
          MAX_GAPS: ${{ steps.kr_syncs.outputs.max_gaps }}
        shell: bash
        run: |
          {
            echo "## Phase 10E production acceptance"
            echo
            echo "- KR active catalog: ${BASE_COUNT} -> ${FINAL_COUNT}"
            echo "- Accepted row writes across 3 bounded KR syncs: ${TOTAL_CHANGED}"
            echo "- Maximum per-run external request budget: ${MAX_BUDGET} / 24"
            echo "- Maximum per-run detail selections: ${MAX_SELECTED} / 18"
            echo "- Maximum schedule-gap candidates: ${MAX_GAPS} / 4"
            echo "- Baseline benchmark titles naturally present after convergence: ${BENCHMARKS} / 8"
            echo "- Future Korean TVmaze-owned episodes: ${BASE_TVMAZE} -> ${FINAL_TVMAZE}"
            echo "- Out-of-policy Korean active rows: 0"
            echo "- Future non-KR TMDB fallback leakage: 0"
            echo "- tmdb_kr health: PASS"
            echo "- production ops health: PASS"
          } >> "${GITHUB_STEP_SUMMARY}"
