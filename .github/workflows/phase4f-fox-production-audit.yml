name: Phase 4F FOX production acceptance

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'phase-4f-fox-production-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: phase-4f-fox-production-audit

      - name: Verify FOX catalog coverage in production
        run: node scripts/audit-phase4f-fox-production.mjs
