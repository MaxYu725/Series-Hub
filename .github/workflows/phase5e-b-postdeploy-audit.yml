name: Audit Phase 5E-B post-deploy baseline

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'audit-phase5e-b-postdeploy'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ID }}
      WRANGLER_VERSION: "4.125.0"
      PRODUCTION_DB_NAME: "series-hub-db"
      PRODUCTION_URL: "https://series-hub.max-yu-jp.workers.dev"

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Verify Phase 5E-C starting baseline
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

          STATE_JSON="$(npx --yes wrangler@"${WRANGLER_VERSION}" d1 execute "${PRODUCTION_DB_NAME}" --remote --json --command "SELECT (SELECT COUNT(*) FROM shows WHERE status IN ('airing','upcoming','planned')) AS active_shows, (SELECT COUNT(*) FROM shows WHERE status IN ('airing','upcoming','planned') AND tvmaze_id IS NOT NULL) AS active_tvmaze_mapped, (SELECT COUNT(*) FROM shows WHERE status IN ('airing','upcoming','planned') AND tvmaze_id IS NULL) AS active_tvmaze_unmapped, (SELECT COUNT(*) FROM shows WHERE status IN ('airing','upcoming','planned') AND tvmaze_synced_at IS NULL) AS never_tvmaze_synced, (SELECT COUNT(*) FROM shows s LEFT JOIN preferred_show_titles p ON p.show_id=s.id WHERE s.status IN ('airing','upcoming','planned') AND p.title_zh_hk IS NOT NULL AND p.title_zh_hk<>'') AS hk_covered, (SELECT COUNT(*) FROM episodes e JOIN seasons se ON se.id=e.season_id JOIN shows s ON s.id=se.show_id WHERE s.status IN ('airing','upcoming','planned') AND se.season_number>0 AND e.episode_number>0) AS active_numbered_episodes, (SELECT COUNT(*) FROM episodes e JOIN seasons se ON se.id=e.season_id JOIN shows s ON s.id=se.show_id WHERE s.status IN ('airing','upcoming','planned') AND se.season_number>0 AND e.episode_number>0 AND e.air_timestamp IS NOT NULL AND e.air_timestamp<>'') AS active_timestamped_episodes, ROUND(MAX((julianday('now')-julianday(tvmaze_synced_at))*24),2) AS max_tvmaze_age_hours, ROUND(AVG((julianday('now')-julianday(tvmaze_synced_at))*24),2) AS avg_tvmaze_age_hours FROM shows WHERE status IN ('airing','upcoming','planned') AND tvmaze_synced_at IS NOT NULL; SELECT src.source_key, sr.status, sr.records_seen, sr.records_changed, ROUND((julianday('now')-julianday(sr.started_at))*24,2) AS hours_ago FROM sources src LEFT JOIN sync_runs sr ON sr.id=(SELECT id FROM sync_runs x WHERE x.source_id=src.id ORDER BY x.started_at DESC,x.id DESC LIMIT 1) WHERE src.source_key IN ('tmdb','tvmaze') ORDER BY src.source_key;" )"

          STATE_JSON="${STATE_JSON}" node - <<'NODE'
          const data = JSON.parse(process.env.STATE_JSON);
          const found=[]; const walk=v=>{if(Array.isArray(v))return v.forEach(walk); if(!v||typeof v!=='object')return; found.push(v); Object.values(v).forEach(walk);}; walk(data);
          const base=found.find(x=>'active_shows' in x)||{}; const sync=found.filter(x=>'source_key' in x);
          console.log(`active shows: ${base.active_shows}`);
          console.log(`mapped/unmapped: ${base.active_tvmaze_mapped}/${base.active_tvmaze_unmapped}`);
          console.log(`never TVmaze synced: ${base.never_tvmaze_synced}`);
          console.log(`TVmaze age max/avg hours: ${base.max_tvmaze_age_hours}/${base.avg_tvmaze_age_hours}`);
          console.log(`HK covered: ${base.hk_covered}`);
          console.log(`numbered/timestamped: ${base.active_numbered_episodes}/${base.active_timestamped_episodes}`);
          for(const row of sync) console.log(`${row.source_key}: ${row.status}, seen=${row.records_seen}, changed=${row.records_changed}, age=${row.hours_ago}h`);
          if(Number(base.active_shows||0)<67) throw new Error('Catalog regressed');
          if(Number(base.active_timestamped_episodes||0)!==Number(base.active_numbered_episodes||0)) throw new Error('Timestamp coverage regressed');
          if(!sync.some(x=>x.source_key==='tvmaze' && ['success','success_with_warnings'].includes(x.status))) throw new Error('TVmaze latest sync unhealthy');
          NODE

          HEALTH="$(curl --fail --silent --show-error --retry 3 --retry-all-errors "${PRODUCTION_URL}/health")"
          HEALTH="${HEALTH}" node -e 'const h=JSON.parse(process.env.HEALTH); if(h.ok!==true) process.exit(1);'
