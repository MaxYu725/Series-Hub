name: PR118 one-shot hotfix

on:
  push:
    branches:
      - phase10a1-rejected-row-cleanup

permissions:
  contents: write

jobs:
  hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase10a1-rejected-row-cleanup
          fetch-depth: 0

      - name: Apply reviewed base-policy cleanup fix
        shell: python
        run: |
          from pathlib import Path

          source_path = Path("src/tmdb-korea.js")
          source = source_path.read_text()
          old_source = '''      const details = entry.result.value;
                if (!isIncludedKoreanScriptedSeries(details)) continue;
                if (includeDetails && !includeDetails(details)) {'''.replace("        ", "")
          new_source = '''      const details = entry.result.value;
                if (!isIncludedKoreanScriptedSeries(details)) {
                  recordsRejected += 1;
                  if (onRejectedDetails) await onRejectedDetails(details, env.DB);
                  continue;
                }
                if (includeDetails && !includeDetails(details)) {'''.replace("        ", "")
          if source.count(old_source) != 1:
              raise SystemExit("expected exactly one base-policy rejection block")
          source_path.write_text(source.replace(old_source, new_source))

          test_path = Path("test/phase10a-korea.test.js")
          test = test_path.read_text()
          old_test = '''  const qualityGateIndex = source.indexOf("includeDetails && !includeDetails(details)");
            const cleanupHookIndex = source.indexOf("await onRejectedDetails(details, env.DB)");
            const persistIndex = source.indexOf("await persistSeries(env.DB, normalized)");
            const successIndex = source.indexOf('const status = warnings.length ? "success_with_warnings" : "success"');
            assert.ok(qualityGateIndex > 0 && persistIndex > qualityGateIndex, "quality gate must run before D1 persistence");
            assert.ok(cleanupHookIndex > qualityGateIndex && successIndex > cleanupHookIndex, "cleanup must finish before sync success is recorded");'''.replace("          ", "")
          new_test = '''  const basePolicyIndex = source.indexOf("if (!isIncludedKoreanScriptedSeries(details)) {");
            const firstCleanupHookIndex = source.indexOf("await onRejectedDetails(details, env.DB)");
            const qualityGateIndex = source.indexOf("includeDetails && !includeDetails(details)");
            const qualityCleanupHookIndex = source.lastIndexOf("await onRejectedDetails(details, env.DB)");
            const persistIndex = source.indexOf("await persistSeries(env.DB, normalized)");
            const successIndex = source.indexOf('const status = warnings.length ? "success_with_warnings" : "success"');
            assert.ok(basePolicyIndex > 0 && firstCleanupHookIndex > basePolicyIndex && qualityGateIndex > firstCleanupHookIndex, "base-policy rejection must reach stale cleanup before the quality gate");
            assert.ok(qualityGateIndex > 0 && persistIndex > qualityGateIndex, "quality gate must run before D1 persistence");
            assert.ok(qualityCleanupHookIndex > qualityGateIndex && successIndex > qualityCleanupHookIndex, "cleanup must finish before sync success is recorded");'''.replace("          ", "")
          if test.count(old_test) != 1:
              raise SystemExit("expected exactly one cleanup ordering assertion block")
          test_path.write_text(test.replace(old_test, new_test))

      - name: Commit hotfix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr118-one-shot-hotfix.yml
          git add src/tmdb-korea.js test/phase10a-korea.test.js
          git commit -m "Clean stale rows rejected by base Korean policy"
          git push origin HEAD:phase10a1-rejected-row-cleanup
