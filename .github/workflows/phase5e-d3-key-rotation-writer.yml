name: Apply Phase 5E-D3 source key rotation

on:
  push:
    branches:
      - phase-5e-d3-internal-key-rotation
    paths:
      - .github/workflows/phase5e-d3-key-rotation-writer.yml

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-5e-d3-internal-key-rotation

      - name: Rotate backend derivation context
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/index.js')
          text = path.read_text()
          if 'series-hub:tmdb-sync:v1:' not in text:
              raise SystemExit('missing v1 derivation context')
          path.write_text(text.replace('series-hub:tmdb-sync:v1:', 'series-hub:tmdb-sync:v2:', 1))
          PY

      - name: Commit backend key rotation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          git diff --cached --check
          git commit -m "Phase 5E-D3: rotate backend internal auth key"
          git push origin HEAD:phase-5e-d3-internal-key-rotation
