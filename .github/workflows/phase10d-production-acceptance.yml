name: Phase 10D production acceptance

on:
  push:
    branches:
      - diagnostic/phase10d-production-acceptance

permissions:
  contents: read

env:
  PRODUCTION_URL: "https://series-hub.max-yu-jp.workers.dev"

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TMDB_API_TOKEN: ${{ secrets.TMDB_API }}
    steps:
      - name: Validate secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TMDB_API_TOKEN:-}" || { echo "TMDB_API secret is missing"; exit 1; }

      - name: Resolve production Korean show identities
        id: shows
        shell: bash
        run: |
          set -euo pipefail
          GP_JSON="$(curl --fail --silent --show-error "${PRODUCTION_URL}/api/search?q=Good%20Partner&market=KR&limit=20")"
          AOUAD_JSON="$(curl --fail --silent --show-error "${PRODUCTION_URL}/api/search?q=All%20of%20Us%20Are%20Dead&market=KR&limit=20")"
          GP_ID="$(RESPONSE="${GP_JSON}" node -e '
            const p=JSON.parse(process.env.RESPONSE); const r=(p.data||[]).find(x=>Number(x.tmdb_id)===243761 && String(x.origin_country||"").split(",").includes("KR")); if(!r) process.exit(1); process.stdout.write(String(r.id));
          ')"
          AOUAD_ID="$(RESPONSE="${AOUAD_JSON}" node -e '
            const p=JSON.parse(process.env.RESPONSE); const r=(p.data||[]).find(x=>Number(x.tmdb_id)===99966 && String(x.origin_country||"").split(",").includes("KR")); if(!r) process.exit(1); process.stdout.write(String(r.id));
          ')"
          echo "gp_id=${GP_ID}" >> "${GITHUB_OUTPUT}"
          echo "aouad_id=${AOUAD_ID}" >> "${GITHUB_OUTPUT}"
          echo "Resolved Good Partner -> ${GP_ID}; All of Us Are Dead -> ${AOUAD_ID}"

      - name: Derive protected editorial key
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          KEY="$(node -e '
            const crypto=require("crypto"); process.stdout.write(crypto.createHash("sha256").update("series-hub:tmdb-sync:v2:"+process.env.TMDB_API_TOKEN).digest("hex"));
          ')"
          echo "::add-mask::${KEY}"
          echo "key=${KEY}" >> "${GITHUB_OUTPUT}"

      - name: Apply Good Partner season 2 renewal evidence
        env:
          INTERNAL_KEY: ${{ steps.auth.outputs.key }}
          SHOW_ID: ${{ steps.shows.outputs.gp_id }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' > /tmp/evidence.json
          const payload={
            action:"upsert",
            showId:Number(process.env.SHOW_ID),
            seasonNumber:2,
            eventType:"renewed",
            sourceKey:"sbs_news",
            sourceUrl:"https://news.sbs.co.kr/news/endPage.do?news_id=N1008049198",
            sourceTitle:"SBS 드라마 '굿파트너', 시즌2 제작 확정",
            sourcePublishedAt:"2025-04-04",
            confidence:"official",
            evidenceNote:"SBS officially confirmed production of Good Partner season 2; casting, filming and broadcast timing were still undecided."
          };
          process.stdout.write(JSON.stringify(payload));
          NODE
          RESPONSE="$(curl --fail-with-body --silent --show-error -X POST -H "content-type: application/json" -H "x-series-hub-sync-key: ${INTERNAL_KEY}" --data-binary @/tmp/evidence.json "${PRODUCTION_URL}/api/internal/lifecycle-evidence")"
          printf '%s\n' "${RESPONSE}"
          RESPONSE="${RESPONSE}" node -e 'const p=JSON.parse(process.env.RESPONSE); if(p.ok!==true || p.event?.event_type!=="renewed" || p.source?.key!=="sbs_news" || p.source?.trustLevel!=="official") process.exit(1);'
          rm -f /tmp/evidence.json

      - name: Apply All of Us Are Dead season 2 filming evidence
        env:
          INTERNAL_KEY: ${{ steps.auth.outputs.key }}
          SHOW_ID: ${{ steps.shows.outputs.aouad_id }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' > /tmp/evidence.json
          const payload={
            action:"upsert",
            showId:Number(process.env.SHOW_ID),
            seasonNumber:2,
            eventType:"filming",
            sourceKey:"netflix_about_news",
            sourceUrl:"https://about.netflix.com/en/news/all-of-us-are-dead-season-2-now-in-production",
            sourceTitle:"Production of YA Zombie Series 'All of Us Are Dead' Season 2 is Now Underway",
            sourcePublishedAt:"2025-07-22",
            confidence:"official",
            evidenceNote:"Netflix officially confirmed that production had begun on All of Us Are Dead season 2."
          };
          process.stdout.write(JSON.stringify(payload));
          NODE
          RESPONSE="$(curl --fail-with-body --silent --show-error -X POST -H "content-type: application/json" -H "x-series-hub-sync-key: ${INTERNAL_KEY}" --data-binary @/tmp/evidence.json "${PRODUCTION_URL}/api/internal/lifecycle-evidence")"
          printf '%s\n' "${RESPONSE}"
          RESPONSE="${RESPONSE}" node -e 'const p=JSON.parse(process.env.RESPONSE); if(p.ok!==true || p.event?.event_type!=="filming" || p.source?.key!=="netflix_about_news" || p.source?.trustLevel!=="official") process.exit(1);'
          rm -f /tmp/evidence.json

      - name: Verify per-show public lifecycle projections
        env:
          GP_ID: ${{ steps.shows.outputs.gp_id }}
          AOUAD_ID: ${{ steps.shows.outputs.aouad_id }}
        shell: bash
        run: |
          set -euo pipefail
          GP="$(curl --fail --silent --show-error "${PRODUCTION_URL}/api/shows/${GP_ID}/lifecycle")"
          AOUAD="$(curl --fail --silent --show-error "${PRODUCTION_URL}/api/shows/${AOUAD_ID}/lifecycle")"
          RESPONSE="${GP}" node -e '
            const p=JSON.parse(process.env.RESPONSE); const e=(p.data||[]).find(x=>x.event_type==="renewed"&&Number(x.season_number)===2&&x.source_key==="sbs_news"&&x.confidence==="official"&&x.trust_level==="official"); if(!e||e.source_url!=="https://news.sbs.co.kr/news/endPage.do?news_id=N1008049198"||p.summary?.bySeason?.["2"]?.decision?.event_type!=="renewed"||p.meta?.authoritativeFactsOnly!==true) process.exit(1);
          '
          RESPONSE="${AOUAD}" node -e '
            const p=JSON.parse(process.env.RESPONSE); const e=(p.data||[]).find(x=>x.event_type==="filming"&&Number(x.season_number)===2&&x.source_key==="netflix_about_news"&&x.confidence==="official"&&x.trust_level==="official"); if(!e||e.source_url!=="https://about.netflix.com/en/news/all-of-us-are-dead-season-2-now-in-production"||p.summary?.bySeason?.["2"]?.production?.event_type!=="filming"||p.meta?.authoritativeFactsOnly!==true) process.exit(1);
          '
          echo "Per-show lifecycle projections verified."

      - name: Verify shared lifecycle index and production health
        env:
          GP_ID: ${{ steps.shows.outputs.gp_id }}
          AOUAD_ID: ${{ steps.shows.outputs.aouad_id }}
        shell: bash
        run: |
          set -euo pipefail
          INDEX="$(curl --fail --silent --show-error "${PRODUCTION_URL}/api/lifecycle")"
          RESPONSE="${INDEX}" GP_ID="${GP_ID}" AOUAD_ID="${AOUAD_ID}" node -e '
            const p=JSON.parse(process.env.RESPONSE); const gp=p.data?.[process.env.GP_ID]; const ao=p.data?.[process.env.AOUAD_ID]; if(p.meta?.authoritativeFactsOnly!==true) process.exit(1); if(!gp?.events?.some(e=>e.source_key==="sbs_news"&&e.event_type==="renewed")) process.exit(1); if(!ao?.events?.some(e=>e.source_key==="netflix_about_news"&&e.event_type==="filming")) process.exit(1);
          '
          HEALTH="$(curl --fail --silent --show-error "${PRODUCTION_URL}/api/ops-status")"
          RESPONSE="${HEALTH}" node -e 'const p=JSON.parse(process.env.RESPONSE); if(p.ok!==true) process.exit(1);'
          echo "Shared lifecycle projection and ops health verified."

      - name: Publish acceptance summary
        env:
          GP_ID: ${{ steps.shows.outputs.gp_id }}
          AOUAD_ID: ${{ steps.shows.outputs.aouad_id }}
        shell: bash
        run: |
          {
            echo "## Phase 10D production acceptance"
            echo
            echo "- Good Partner: Series Hub ${GP_ID}, TMDB 243761, S2 renewed, source sbs_news, official"
            echo "- All of Us Are Dead: Series Hub ${AOUAD_ID}, TMDB 99966, S2 filming, source netflix_about_news, official"
            echo "- Existing per-show lifecycle projection: PASS"
            echo "- Shared lifecycle index projection: PASS"
            echo "- Production ops health: PASS"
            echo "- No catalog/schedule sync budget or provider ownership changes"
          } >> "${GITHUB_STEP_SUMMARY}"
