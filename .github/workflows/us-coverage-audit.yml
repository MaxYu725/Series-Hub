name: US coverage read-only audit

on:
  push:
    branches:
      - diagnostic/us-coverage-audit

permissions:
  contents: read

env:
  WRANGLER_VERSION: "4.125.0"
  PRODUCTION_DB_NAME: "series-hub-db"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TMDB_API_TOKEN: ${{ secrets.TMDB_API }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TMDB_API_TOKEN:-}" || { echo "TMDB_API secret missing"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CF_API secret missing"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CF_ID secret missing"; exit 1; }

      - name: Snapshot production US catalog
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@"${WRANGLER_VERSION}" d1 execute "${PRODUCTION_DB_NAME}" --remote --json --command \
            "SELECT tmdb_id, english_title, status, tmdb_status, series_type, origin_country, last_synced_at FROM shows WHERE tmdb_id IS NOT NULL AND (',' || COALESCE(origin_country,'') || ',') LIKE '%,US,%' ORDER BY id;" \
            > /tmp/us-db.json
          test -s /tmp/us-db.json

      - name: Audit TMDB coverage without production writes
        shell: bash
        run: |
          set -euo pipefail
          US_DB_JSON=/tmp/us-db.json node scripts/us-coverage-audit.mjs | tee /tmp/us-coverage.log

      - name: Publish summary
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const s = JSON.parse(fs.readFileSync('/tmp/us-coverage-summary.json','utf8'));
          const c = s.currentRunSimulation.selectedStats;
          const b = s.broaderSample;
          console.log(`US active catalog: ${s.productionDb.usActiveRows} / total US rows ${s.productionDb.usRowsTotal}`);
          console.log(`Current 40 detail slots: ${c.alreadyActive} already-active, ${c.absent} absent, ${c.presentInactive} inactive-in-DB`);
          console.log(`Eligible among current 40: ${c.eligible}; eligible new/returning: ${c.eligibleAbsent + c.eligiblePresentInactive}`);
          console.log(`Broader sample: ${b.uniqueCandidates} candidates; top ${b.detailAudited} non-active audited; ${b.eligibleActiveMissingInAuditedTop120} eligible active missing`);
          console.log(`Eligible missing split: ${b.eligibleAbsent} absent, ${b.eligiblePresentButInactive} stale-inactive`);
          console.log('Top eligible missing:');
          for (const row of b.topEligibleMissing.slice(0, 15)) {
            console.log(`- ${row.name} [${row.id}] ${row.lifecycle} db=${row.dbState} networks=${row.networks.join(', ')}`);
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `## US coverage read-only audit\n\n` +
            `- Active US catalog: **${s.productionDb.usActiveRows}**\n` +
            `- Current 40 detail slots already active: **${c.alreadyActive}**\n` +
            `- Current slots eligible new/returning: **${c.eligibleAbsent + c.eligiblePresentInactive}**\n` +
            `- Broader sampled candidates: **${b.uniqueCandidates}**\n` +
            `- Eligible active missing among top ${b.detailAudited} audited non-active: **${b.eligibleActiveMissingInAuditedTop120}**\n` +
            `- Missing entirely: **${b.eligibleAbsent}**; stale inactive in D1: **${b.eligiblePresentButInactive}**\n`
          );
          NODE
