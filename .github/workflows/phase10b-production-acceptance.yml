name: Phase 10B.1 production priority probe

on:
  push:
    branches:
      - diagnostic/phase10b-production-acceptance

permissions:
  contents: read

env:
  PRODUCTION_DB_NAME: "series-hub-db"
  WRANGLER_VERSION: "4.125.0"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ID }}

    steps:
      - name: Validate credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CF_API missing"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CF_ID missing"; exit 1; }

      - name: Read Phase 10B.1 priority candidates from production D1
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@"${WRANGLER_VERSION}" d1 execute "${PRODUCTION_DB_NAME}" --remote --json --command \
            "SELECT s.tmdb_id AS id, s.english_title, s.status, s.next_air_date, s.last_synced_at FROM shows s WHERE s.tmdb_id IS NOT NULL AND (',' || COALESCE(s.origin_country, '') || ',') LIKE '%,KR,%' AND s.status IN ('airing', 'upcoming', 'planned') AND NOT EXISTS (SELECT 1 FROM seasons se JOIN episodes e ON e.season_id = se.id WHERE se.show_id = s.id AND e.tvmaze_id IS NOT NULL AND e.air_date >= date('now')) ORDER BY CASE WHEN s.next_air_date IS NULL THEN 1 ELSE 0 END, s.next_air_date ASC, COALESCE(s.last_synced_at, '1970-01-01') ASC, s.id ASC LIMIT 18;" \
            > /tmp/priority.json
          cat /tmp/priority.json

      - name: Validate Good Partner is prioritized
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/priority.json', 'utf8'));
          const groups = Array.isArray(payload) ? payload : [payload];
          const rows = groups.flatMap((group) => Array.isArray(group?.results) ? group.results : []);
          if (!rows.some((row) => Number(row.id) === 243761)) {
            throw new Error(`Good Partner is not in the Phase 10B.1 priority set: ${JSON.stringify(rows)}`);
          }
          console.log('PHASE10B1_PRIORITY_PROBE', JSON.stringify({
            count: rows.length,
            ids: rows.map((row) => Number(row.id)),
            goodPartnerPrioritized: true
          }));
          NODE
