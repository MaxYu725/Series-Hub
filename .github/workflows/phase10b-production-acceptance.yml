name: Phase 10B.1 final production acceptance

on:
  push:
    branches:
      - diagnostic/phase10b-production-acceptance

permissions:
  contents: read

env:
  PRODUCTION_URL: "https://series-hub.max-yu-jp.workers.dev"
  PRODUCTION_DB_NAME: "series-hub-db"
  WRANGLER_VERSION: "4.125.0"

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TMDB_API_TOKEN: ${{ secrets.TMDB_API }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ID }}

    steps:
      - name: Validate credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TMDB_API_TOKEN:-}" || { echo "TMDB_API missing"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CF_API missing"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CF_ID missing"; exit 1; }

      - name: Capture baseline and current TMDB truth
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@"${WRANGLER_VERSION}" d1 execute "${PRODUCTION_DB_NAME}" --remote --json --command \
            "SELECT COUNT(*) AS count FROM episodes e JOIN seasons se ON se.id = e.season_id JOIN shows s ON s.id = se.show_id WHERE (',' || COALESCE(s.origin_country,'') || ',') LIKE '%,KR,%' AND e.tvmaze_id IS NOT NULL AND e.air_date >= date('now');" \
            > /tmp/before-tvmaze.json

          for id in 243761 293610; do
            curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
              -H "accept: application/json" \
              -H "authorization: Bearer ${TMDB_API_TOKEN}" \
              "https://api.themoviedb.org/3/tv/${id}" > "/tmp/tmdb-${id}.json"
          done

      - name: Run production Korean catalog sync
        shell: bash
        run: |
          set -euo pipefail
          SYNC_KEY="$(node -e '
            const crypto = require("crypto");
            process.stdout.write(crypto.createHash("sha256").update("series-hub:tmdb-sync:v2:" + process.env.TMDB_API_TOKEN).digest("hex"));
          ')"
          echo "::add-mask::${SYNC_KEY}"

          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            -X POST \
            -H "x-series-hub-sync-key: ${SYNC_KEY}" \
            "${PRODUCTION_URL}/api/internal/tmdb-sync-kr" > /tmp/kr-sync.json
          cat /tmp/kr-sync.json

          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/kr-sync.json', 'utf8'));
          if (data.ok !== true) throw new Error(`KR sync failed: ${JSON.stringify(data)}`);
          if (data.schedulePolicy !== 'tvmaze_primary_tmdb_next_episode_fallback') {
            throw new Error(`Unexpected schedule policy: ${data.schedulePolicy}`);
          }
          if (Number(data.externalRequestBudget) > 24) {
            throw new Error(`KR request ceiling exceeded: ${data.externalRequestBudget}`);
          }
          if (Number(data.recordsSelected) > 18) {
            throw new Error(`KR detail ceiling exceeded: ${data.recordsSelected}`);
          }
          if (Number(data.scheduleGapCandidates || 0) < 1) {
            throw new Error(`No schedule-gap candidates were prioritized: ${JSON.stringify(data)}`);
          }
          NODE

      - name: Read production acceptance state
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@"${WRANGLER_VERSION}" d1 execute "${PRODUCTION_DB_NAME}" --remote --json --command \
            "SELECT s.tmdb_id AS show_tmdb_id, s.english_title, se.season_number, e.episode_number, e.air_date, e.tvmaze_id, e.tmdb_id AS episode_tmdb_id, e.source_url FROM shows s JOIN seasons se ON se.show_id = s.id JOIN episodes e ON e.season_id = se.id WHERE s.tmdb_id IN (243761,293610) AND e.air_date >= date('now') ORDER BY s.tmdb_id, e.air_date, se.season_number, e.episode_number;" \
            > /tmp/after-targets.json

          npx --yes wrangler@"${WRANGLER_VERSION}" d1 execute "${PRODUCTION_DB_NAME}" --remote --json --command \
            "SELECT COUNT(*) AS count FROM episodes e JOIN seasons se ON se.id = e.season_id JOIN shows s ON s.id = se.show_id WHERE (',' || COALESCE(s.origin_country,'') || ',') LIKE '%,KR,%' AND e.tvmaze_id IS NOT NULL AND e.air_date >= date('now');" \
            > /tmp/after-tvmaze.json

          npx --yes wrangler@"${WRANGLER_VERSION}" d1 execute "${PRODUCTION_DB_NAME}" --remote --json --command \
            "SELECT COUNT(*) AS count FROM episodes e JOIN seasons se ON se.id = e.season_id JOIN shows s ON s.id = se.show_id WHERE e.tvmaze_id IS NULL AND e.tmdb_id IS NOT NULL AND e.source_url LIKE 'https://www.themoviedb.org/tv/%' AND e.air_date >= date('now') AND (',' || COALESCE(s.origin_country,'') || ',') NOT LIKE '%,KR,%';" \
            > /tmp/non-kr-fallbacks.json

          npx --yes wrangler@"${WRANGLER_VERSION}" d1 execute "${PRODUCTION_DB_NAME}" --remote --json --command \
            "SELECT sr.status, sr.records_seen, sr.records_changed, sr.started_at, sr.finished_at FROM sync_runs sr JOIN sources s ON s.id = sr.source_id WHERE s.source_key = 'tmdb_kr' ORDER BY sr.id DESC LIMIT 1;" \
            > /tmp/kr-status.json

          cat /tmp/after-targets.json

      - name: Validate final Phase 10B.1 acceptance
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const today = new Date().toISOString().slice(0, 10);

          function rows(path) {
            const payload = JSON.parse(fs.readFileSync(path, 'utf8'));
            const groups = Array.isArray(payload) ? payload : [payload];
            return groups.flatMap((group) => Array.isArray(group?.results) ? group.results : []);
          }

          const after = rows('/tmp/after-targets.json');
          const beforeTvmaze = Number(rows('/tmp/before-tvmaze.json')[0]?.count || 0);
          const afterTvmaze = Number(rows('/tmp/after-tvmaze.json')[0]?.count || 0);
          const nonKrFallbacks = Number(rows('/tmp/non-kr-fallbacks.json')[0]?.count || 0);
          const krStatus = rows('/tmp/kr-status.json')[0] || null;
          const sync = JSON.parse(fs.readFileSync('/tmp/kr-sync.json', 'utf8'));

          const expected = [243761, 293610]
            .map((id) => JSON.parse(fs.readFileSync(`/tmp/tmdb-${id}.json`, 'utf8')))
            .map((show) => {
              const episode = show.next_episode_to_air;
              if (!episode || typeof episode.air_date !== 'string' || episode.air_date < today) return null;
              return {
                showTmdbId: Number(show.id),
                seasonNumber: Number(episode.season_number),
                episodeNumber: Number(episode.episode_number),
                airDate: episode.air_date
              };
            })
            .filter(Boolean);

          const matched = expected.map((item) => ({
            expected: item,
            row: after.find((row) =>
              Number(row.show_tmdb_id) === item.showTmdbId &&
              Number(row.season_number) === item.seasonNumber &&
              Number(row.episode_number) === item.episodeNumber &&
              row.air_date === item.airDate
            ) || null
          }));
          const missing = matched.filter((item) => !item.row).map((item) => item.expected);

          if (missing.length) {
            throw new Error(`Production D1 is missing current TMDB next episodes: ${JSON.stringify(missing)}`);
          }
          for (const item of matched) {
            const row = item.row;
            if (!row.tvmaze_id && !(row.episode_tmdb_id && String(row.source_url || '').startsWith('https://www.themoviedb.org/tv/'))) {
              throw new Error(`Target lacks schedule provenance: ${JSON.stringify(row)}`);
            }
          }
          if (nonKrFallbacks !== 0) {
            throw new Error(`Found ${nonKrFallbacks} future TMDB fallback rows outside KR catalog`);
          }
          if (afterTvmaze < beforeTvmaze) {
            throw new Error(`KR future TVmaze ownership regressed from ${beforeTvmaze} to ${afterTvmaze}`);
          }
          if (!krStatus || !['success', 'success_with_warnings'].includes(krStatus.status)) {
            throw new Error(`Latest tmdb_kr sync is unhealthy: ${JSON.stringify(krStatus)}`);
          }

          const result = {
            expectedCurrentTargets: expected.length,
            targetsPresentAfter: matched.length,
            scheduleGapCandidates: Number(sync.scheduleGapCandidates || 0),
            scheduleFallbacksApplied: Number(sync.scheduleFallbacksApplied || 0),
            scheduleFallbacksPruned: Number(sync.scheduleFallbacksPruned || 0),
            externalRequestBudget: Number(sync.externalRequestBudget || 0),
            recordsSelected: Number(sync.recordsSelected || 0),
            krFutureTvmazeBefore: beforeTvmaze,
            krFutureTvmazeAfter: afterTvmaze,
            nonKrFallbacks,
            krSyncStatus: krStatus.status
          };
          console.log('PHASE10B1_ACCEPTED', JSON.stringify(result));

          const summary = [
            '## Phase 10B.1 final production acceptance',
            '',
            `- Current actionable TMDB targets: ${result.expectedCurrentTargets}`,
            `- Targets present after sync: ${result.targetsPresentAfter}`,
            `- Schedule-gap candidates prioritized: ${result.scheduleGapCandidates}`,
            `- Fallbacks applied: ${result.scheduleFallbacksApplied}`,
            `- Fallbacks pruned: ${result.scheduleFallbacksPruned}`,
            `- External request budget used: ${result.externalRequestBudget} / 24`,
            `- Detail candidates selected: ${result.recordsSelected} / 18`,
            `- KR future TVmaze rows: ${beforeTvmaze} -> ${afterTvmaze}`,
            `- Future non-KR TMDB fallback rows: ${nonKrFallbacks}`,
            `- Latest tmdb_kr status: ${krStatus.status}`,
            '',
            'Result: ACCEPTED'
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary.join('\n')}\n`);
          NODE
