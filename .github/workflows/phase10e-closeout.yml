name: Phase 10E closeout patch

on:
  push:
    branches:
      - phase10e-closeout

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply Korea roadmap closeout
        run: node .phase10e-closeout.cjs

      - name: Run unit tests
        run: npm test

      - name: Commit formal closeout and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MaxYu725"
          git config user.email "maxyu0725@outlook.com"
          git rm .phase10e-closeout.cjs .github/workflows/phase10e-closeout.yml
          git add docs/PHASE10_KOREA.md docs/PHASE10E_KOREA_COVERAGE.md
          git commit -m "Phase 10E: close production acceptance"
          git push origin HEAD:phase10e-closeout
