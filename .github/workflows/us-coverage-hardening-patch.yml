name: US coverage hardening patch

on:
  push:
    branches:
      - us-coverage-hardening-final

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: us-coverage-hardening-final
          fetch-depth: 0

      - name: Apply patch
        run: node scripts/us-coverage-hardening-patch.cjs

      - name: Stabilize source-contract assertion
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'test/us-coverage-hardening.test.js';
          let text = fs.readFileSync(path, 'utf8');
          const marker = 'test("US hardening expands in-memory coverage rather than the network budget", () => {';
          const index = text.indexOf(marker);
          if (index < 0) throw new Error('US hardening source-contract test marker missing');
          text = text.slice(0, index) + `test("US hardening expands in-memory coverage rather than the network budget", () => {
            const source = fs.readFileSync(new URL("../src/tmdb.js", import.meta.url), "utf8");
            assert.ok(source.includes("const networkCandidatePoolLimit = Math.max(0, US_DISCOVERY_CANDIDATE_POOL_LIMIT - 40);"));
            assert.ok(source.includes("externalRequestBudget: candidateFeeds.length + selectedCandidates.length"));
            assert.ok(source.includes('coveragePolicy: "bounded_new_candidate_priority_with_refresh_reserve"'));
            assert.ok(source.includes("scheduleLookaheadDays: US_SCHEDULE_LOOKAHEAD_DAYS"));
          });
          `;
          fs.writeFileSync(path, text);
          NODE

      - name: Run unit tests
        run: npm test

      - name: Commit formal hardening and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MaxYu725"
          git config user.email "maxyu0725@outlook.com"
          git rm -f .github/workflows/us-coverage-hardening-patch.yml scripts/us-coverage-hardening-patch.cjs
          git add src/tmdb.js test/us-coverage-hardening.test.js docs/US_COVERAGE_HARDENING.md
          git commit -m "Harden US catalog discovery coverage"
          git push origin HEAD:us-coverage-hardening-final
