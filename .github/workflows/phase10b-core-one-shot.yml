name: Phase10B core one-shot

on:
  push:
    branches:
      - phase10b-korea-schedule-fallback

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase10b-korea-schedule-fallback
          fetch-depth: 0

      - name: Apply bounded core patch
        shell: python
        run: |
          from pathlib import Path

          def once(path, old, new):
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}: {old[:100]!r}")
              path.write_text(text.replace(old, new))

          korea = Path("src/tmdb-korea.js")
          old = "  const onRejectedDetails = typeof options.onRejectedDetails === \"function\"\n    ? options.onRejectedDetails\n    : null;\n"
          new = old + "  const onAcceptedDetails = typeof options.onAcceptedDetails === \"function\"\n    ? options.onAcceptedDetails\n    : null;\n"
          once(korea, old, new)

          old = "      await persistSeries(env.DB, normalized);\n      recordsChanged += 1;\n"
          new = "      const showId = await persistSeries(env.DB, normalized);\n      recordsChanged += 1;\n      if (onAcceptedDetails) {\n        await onAcceptedDetails(details, env.DB, { showId, normalized, now });\n      }\n"
          once(korea, old, new)

          tvmaze = Path("src/tvmaze.js")
          once(
              tvmaze,
              "async function replaceTvmazeEpisodes(db, show, normalizedEpisodes) {\n  await db\n",
              "async function replaceTvmazeEpisodes(db, show, normalizedEpisodes, now = new Date()) {\n  await db\n"
          )

          old = "    .bind(show.id)\n    .run();\n\n  let inserted = 0;\n"
          new = "    .bind(show.id)\n    .run();\n\n  const today = todayUtc(now);\n  const hasFutureTvmazeSchedule = normalizedEpisodes.some((episode) => episode.airDate >= today);\n  if (hasFutureTvmazeSchedule) {\n    await db\n      .prepare(\n        `DELETE FROM episodes\n         WHERE tvmaze_id IS NULL\n           AND tmdb_id IS NOT NULL\n           AND source_url LIKE 'https://www.themoviedb.org/tv/%'\n           AND air_date >= ?2\n           AND season_id IN (SELECT id FROM seasons WHERE show_id = ?1)`\n      )\n      .bind(show.id, today)\n      .run();\n  }\n\n  let inserted = 0;\n"
          once(tvmaze, old, new)

          old = "  const limit = Math.min(Math.max(Number(options.limit) || SHOWS_PER_SYNC, 1), SHOWS_PER_SYNC);\n  const sourceId = await getSourceId(env.DB);\n"
          new = "  const limit = Math.min(Math.max(Number(options.limit) || SHOWS_PER_SYNC, 1), SHOWS_PER_SYNC);\n  const now = options.now instanceof Date && Number.isFinite(options.now.getTime())\n    ? options.now\n    : new Date();\n  const sourceId = await getSourceId(env.DB);\n"
          once(tvmaze, old, new)

          old = "        const relevant = selectRelevantEpisodes(episodes)\n          .map(normalizeTvmazeEpisode)\n          .filter(Boolean);\n\n        recordsChanged += await replaceTvmazeEpisodes(env.DB, show, relevant);\n"
          new = "        const relevant = selectRelevantEpisodes(episodes, now)\n          .map(normalizeTvmazeEpisode)\n          .filter(Boolean);\n\n        recordsChanged += await replaceTvmazeEpisodes(env.DB, show, relevant, now);\n"
          once(tvmaze, old, new)

          worker = Path("src/phase10-worker.js")
          text = worker.read_text()
          if text.count('phase: "10a-korea-catalog"') != 2:
              raise SystemExit("expected two Phase 10 status labels")
          worker.write_text(text.replace('phase: "10a-korea-catalog"', 'phase: "10b-korea-schedule"'))

      - name: Commit integration and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase10b-core-one-shot.yml
          git add src/tmdb-korea.js src/tvmaze.js src/phase10-worker.js
          git commit -m "Integrate Phase 10B schedule fallback"
          git push origin HEAD:phase10b-korea-schedule-fallback
