name: Phase10B core one-shot

on:
  push:
    branches:
      - phase10b-korea-schedule-fallback

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase10b-korea-schedule-fallback
          fetch-depth: 0

      - name: Apply bounded core patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              source = path.read_text()
              if source.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}: {old[:80]!r}")
              path.write_text(source.replace(old, new))

          korea = Path("src/tmdb-korea.js")
          replace_once(
              korea,
              '''  const onRejectedDetails = typeof options.onRejectedDetails === "function"
              ? options.onRejectedDetails
              : null;
          ''',
              '''  const onRejectedDetails = typeof options.onRejectedDetails === "function"
              ? options.onRejectedDetails
              : null;
            const onAcceptedDetails = typeof options.onAcceptedDetails === "function"
              ? options.onAcceptedDetails
              : null;
          '''
          )
          replace_once(
              korea,
              '''      await persistSeries(env.DB, normalized);
                recordsChanged += 1;
          ''',
              '''      const showId = await persistSeries(env.DB, normalized);
                recordsChanged += 1;
                if (onAcceptedDetails) {
                  await onAcceptedDetails(details, env.DB, { showId, normalized, now });
                }
          '''
          )

          tvmaze = Path("src/tvmaze.js")
          replace_once(
              tvmaze,
              '''async function replaceTvmazeEpisodes(db, show, normalizedEpisodes) {
            await db
          ''',
              '''async function replaceTvmazeEpisodes(db, show, normalizedEpisodes, now = new Date()) {
            await db
          '''
          )
          replace_once(
              tvmaze,
              '''    .bind(show.id)
              .run();

            let inserted = 0;
          ''',
              '''    .bind(show.id)
              .run();

            const today = todayUtc(now);
            const hasFutureTvmazeSchedule = normalizedEpisodes.some((episode) => episode.airDate >= today);
            if (hasFutureTvmazeSchedule) {
              await db
                .prepare(
                  `DELETE FROM episodes
                   WHERE tvmaze_id IS NULL
                     AND tmdb_id IS NOT NULL
                     AND source_url LIKE 'https://www.themoviedb.org/tv/%'
                     AND air_date >= ?2
                     AND season_id IN (SELECT id FROM seasons WHERE show_id = ?1)`
                )
                .bind(show.id, today)
                .run();
            }

            let inserted = 0;
          '''
          )
          replace_once(
              tvmaze,
              '''  const limit = Math.min(Math.max(Number(options.limit) || SHOWS_PER_SYNC, 1), SHOWS_PER_SYNC);
            const sourceId = await getSourceId(env.DB);
          ''',
              '''  const limit = Math.min(Math.max(Number(options.limit) || SHOWS_PER_SYNC, 1), SHOWS_PER_SYNC);
            const now = options.now instanceof Date && Number.isFinite(options.now.getTime())
              ? options.now
              : new Date();
            const sourceId = await getSourceId(env.DB);
          '''
          )
          replace_once(
              tvmaze,
              '''        const relevant = selectRelevantEpisodes(episodes)
                  .map(normalizeTvmazeEpisode)
                  .filter(Boolean);

                recordsChanged += await replaceTvmazeEpisodes(env.DB, show, relevant);
          '''.replace("                .map", "          .map").replace("                .filter", "          .filter").replace("                recordsChanged", "        recordsChanged"),
              '''        const relevant = selectRelevantEpisodes(episodes, now)
          .map(normalizeTvmazeEpisode)
          .filter(Boolean);

        recordsChanged += await replaceTvmazeEpisodes(env.DB, show, relevant, now);
          '''
          )

          worker = Path("src/phase10-worker.js")
          source = worker.read_text()
          source = source.replace('phase: "10a-korea-catalog"', 'phase: "10b-korea-schedule"')
          if source.count('phase: "10b-korea-schedule"') != 2:
              raise SystemExit("expected two Phase 10 status labels")
          worker.write_text(source)

      - name: Commit core integration and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase10b-core-one-shot.yml
          git add src/tmdb-korea.js src/tvmaze.js src/phase10-worker.js
          git commit -m "Integrate Phase 10B schedule fallback"
          git push origin HEAD:phase10b-korea-schedule-fallback
