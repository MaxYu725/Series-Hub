name: Phase 5D-B production VAPID bootstrap

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: phase5d-production-vapid
  cancel-in-progress: false

env:
  WRANGLER_VERSION: "4.125.0"
  PRODUCTION_DB_NAME: "series-hub-db"
  PRODUCTION_URL: "https://series-hub.max-yu-jp.workers.dev"

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ID }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Validate production credentials and Phase 5D-B gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CF_API secret is missing"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CF_ID secret is missing"; exit 1; }
          node -e '
            const config = require("./wrangler.jsonc");
            if (String(config.vars?.PUSH_SUBSCRIPTIONS_ENABLED) !== "true") {
              console.error("Phase 5D-B production subscription gate is not enabled; VAPID bootstrap is not required.");
              process.exit(1);
            }
          '

      - name: Resolve or create stable production VAPID keypair
        id: vapid
        shell: bash
        run: |
          set -euo pipefail

          STATE_JSON="$(npx --yes wrangler@"${WRANGLER_VERSION}" d1 execute "${PRODUCTION_DB_NAME}" --remote --json --command "SELECT (SELECT config_value FROM push_config WHERE config_key = 'vapid_public_key' LIMIT 1) AS public_key, (SELECT COUNT(*) FROM push_subscriptions) AS subscription_count;")"
          PUBLIC_KEY="$(STATE_JSON="${STATE_JSON}" node -e '
            const data=JSON.parse(process.env.STATE_JSON); let row=null;
            const walk=v=>{ if(Array.isArray(v)) v.forEach(walk); else if(v&&typeof v==="object"){ if("subscription_count" in v) row=v; Object.values(v).forEach(walk); } };
            walk(data); process.stdout.write(row?.public_key || "");
          ')"
          SUBSCRIPTION_COUNT="$(STATE_JSON="${STATE_JSON}" node -e '
            const data=JSON.parse(process.env.STATE_JSON); let row=null;
            const walk=v=>{ if(Array.isArray(v)) v.forEach(walk); else if(v&&typeof v==="object"){ if("subscription_count" in v) row=v; Object.values(v).forEach(walk); } };
            walk(data); process.stdout.write(String(Number(row?.subscription_count || 0)));
          ')"

          SECRET_LIST="$(npx --yes wrangler@"${WRANGLER_VERSION}" secret list --name series-hub)"
          PRIVATE_PRESENT="$(printf '%s' "${SECRET_LIST}" | jq -r 'any(.[]; .name == "VAPID_PRIVATE_KEY")')"

          if [ -n "${PUBLIC_KEY}" ] && [ "${PRIVATE_PRESENT}" = "true" ]; then
            echo "Stable production VAPID keypair already exists; preserving it."
          else
            if [ "${SUBSCRIPTION_COUNT}" -ne 0 ]; then
              echo "VAPID state is incomplete while ${SUBSCRIPTION_COUNT} subscriptions exist; refusing key rotation."
              exit 1
            fi

            KEYS="$(node <<'NODE'
          const crypto = require('crypto');
          const { publicKey, privateKey } = crypto.generateKeyPairSync('ec', { namedCurve: 'prime256v1' });
          const pub = publicKey.export({ format: 'jwk' });
          const priv = privateKey.export({ format: 'jwk' });
          const decode = (value) => Buffer.from(value.replace(/-/g, '+').replace(/_/g, '/'), 'base64');
          const encode = (value) => Buffer.from(value).toString('base64url');
          const rawPublic = Buffer.concat([Buffer.from([4]), decode(pub.x), decode(pub.y)]);
          process.stdout.write(JSON.stringify({ publicKey: encode(rawPublic), privateKey: priv.d }));
          NODE
            )"
            PUBLIC_KEY="$(printf '%s' "${KEYS}" | jq -r '.publicKey')"
            PRIVATE_KEY="$(printf '%s' "${KEYS}" | jq -r '.privateKey')"
            test -n "${PUBLIC_KEY}" && test -n "${PRIVATE_KEY}"
            echo "::add-mask::${PRIVATE_KEY}"

            printf '%s' "${PRIVATE_KEY}" | npx --yes wrangler@"${WRANGLER_VERSION}" secret put VAPID_PRIVATE_KEY --name series-hub
            npx --yes wrangler@"${WRANGLER_VERSION}" d1 execute "${PRODUCTION_DB_NAME}" --remote --command "INSERT INTO push_config (config_key, config_value, created_at, updated_at) VALUES ('vapid_public_key', '${PUBLIC_KEY}', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP) ON CONFLICT(config_key) DO UPDATE SET config_value = excluded.config_value, updated_at = CURRENT_TIMESTAMP;"
          fi

          FINAL_SECRET_LIST="$(npx --yes wrangler@"${WRANGLER_VERSION}" secret list --name series-hub)"
          printf '%s' "${FINAL_SECRET_LIST}" | jq -e '.[] | select(.name == "VAPID_PRIVATE_KEY")' >/dev/null

          FINAL_STATE="$(npx --yes wrangler@"${WRANGLER_VERSION}" d1 execute "${PRODUCTION_DB_NAME}" --remote --json --command "SELECT config_value AS public_key FROM push_config WHERE config_key = 'vapid_public_key' LIMIT 1;")"
          FINAL_PUBLIC_KEY="$(FINAL_STATE="${FINAL_STATE}" node -e '
            const data=JSON.parse(process.env.FINAL_STATE); let key="";
            const walk=v=>{ if(Array.isArray(v)) v.forEach(walk); else if(v&&typeof v==="object"){ if(typeof v.public_key==="string") key=v.public_key; Object.values(v).forEach(walk); } };
            walk(data); process.stdout.write(key);
          ')"
          test -n "${FINAL_PUBLIC_KEY}"
          test "${FINAL_PUBLIC_KEY}" = "${PUBLIC_KEY}"
          echo "public_key=${FINAL_PUBLIC_KEY}" >> "${GITHUB_OUTPUT}"

      - name: Verify live production subscription capability
        env:
          EXPECTED_PUBLIC_KEY: ${{ steps.vapid.outputs.public_key }}
        shell: bash
        run: |
          set -euo pipefail
          READY=0
          for attempt in $(seq 1 30); do
            if CAPABILITY="$(curl --fail --silent --show-error "${PRODUCTION_URL}/api/push/public-key" 2>/dev/null)"; then
              if CAPABILITY="${CAPABILITY}" EXPECTED_PUBLIC_KEY="${EXPECTED_PUBLIC_KEY}" node -e '
                const data = JSON.parse(process.env.CAPABILITY);
                if (data.enabled === true && data.configured === true && data.publicKey === process.env.EXPECTED_PUBLIC_KEY && data.maxShows === 100) process.exit(0);
                process.exit(1);
              '; then
                READY=1
                break
              fi
            fi
            echo "Production Push capability not ready yet (${attempt}/30)"
            sleep 4
          done
          test "${READY}" = "1" || { echo "Production Phase 5D-B Push capability did not become ready"; exit 1; }

      - name: Verify no subscription was created by bootstrap
        shell: bash
        run: |
          set -euo pipefail
          STATE_JSON="$(npx --yes wrangler@"${WRANGLER_VERSION}" d1 execute "${PRODUCTION_DB_NAME}" --remote --json --command "SELECT COUNT(*) AS subscription_count FROM push_subscriptions;")"
          STATE_JSON="${STATE_JSON}" node -e '
            const data=JSON.parse(process.env.STATE_JSON); let count=null;
            const walk=v=>{ if(Array.isArray(v)) v.forEach(walk); else if(v&&typeof v==="object"){ if("subscription_count" in v) count=Number(v.subscription_count); Object.values(v).forEach(walk); } };
            walk(data); if(count !== 0) { console.error(`Expected zero subscriptions before explicit browser opt-in, found ${count}`); process.exit(1); }
          '

      - name: Publish Phase 5D-B production readiness
        shell: bash
        run: |
          {
            echo "## Phase 5D-B production readiness"
            echo
            echo "- Stable VAPID public key in D1: present"
            echo "- VAPID private key in Cloudflare secret: present"
            echo "- Private key committed to GitHub: no"
            echo "- Production subscription gate: enabled"
            echo "- Live public capability endpoint: ready"
            echo "- Subscription created automatically: no"
            echo "- Notification delivery runner: still absent"
            echo "- Next acceptance: one explicit production browser opt-in followed by revoke/delete"
          } >> "${GITHUB_STEP_SUMMARY}"
