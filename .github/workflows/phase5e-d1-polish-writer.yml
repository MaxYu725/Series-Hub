name: Apply Phase 5E-D1 timeout polish

on:
  push:
    branches:
      - phase-5e-d1-ux-resilience
    paths:
      - .github/workflows/phase5e-d1-polish-writer.yml

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-5e-d1-ux-resilience

      - name: Patch My Shows and tracked schedule resilience
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing anchor in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once('public/phase5-ui.js',
              '  const showGrid = document.querySelector("#show-grid");\n',
              '  const showGrid = document.querySelector("#show-grid");\n  const contentPanel = document.querySelector(".content-panel");\n')

          replace_once('public/phase5-ui.js',
              '  async function loadMyShows() {\n',
              '''  async function fetchMyShows(params, timeoutMs = 12000) {
    const controller = new AbortController();
    const timeout = window.setTimeout(() => controller.abort(), timeoutMs);
    try {
      const response = await fetch(`/api/shows?${params}`, { cache: "no-store", signal: controller.signal });
      if (!response.ok) throw new Error(`Shows ${response.status}`);
      return await response.json();
    } finally {
      window.clearTimeout(timeout);
    }
  }

  async function loadMyShows() {
''')

          replace_once('public/phase5-ui.js',
              '    showGrid.hidden = false;\n    scheduleList.hidden = true;\n',
              '    showGrid.hidden = false;\n    scheduleList.hidden = true;\n    contentPanel?.setAttribute("aria-busy", "true");\n')

          replace_once('public/phase5-ui.js',
              '    if (trackedIds.length === 0) {\n      showCount.textContent = "0 套";\n      renderEmpty();\n      return;\n    }',
              '    if (trackedIds.length === 0) {\n      showCount.textContent = "0 套";\n      contentPanel?.setAttribute("aria-busy", "false");\n      renderEmpty();\n      return;\n    }')

          old_fetch = '''      const responses = await Promise.all(STATUS_ORDER.map((status) => {
        const params = new URLSearchParams({ status, limit: "100", region: titleRegion() });
        const query = searchInput.value.trim();
        if (query) params.set("q", query);
        return fetch(`/api/shows?${params}`, { cache: "no-store" });
      }));
      if (activeRequest !== requestId || !myActive) return;
      for (const response of responses) if (!response.ok) throw new Error(`Shows ${response.status}`);
      const payloads = await Promise.all(responses.map((response) => response.json()));
      if (activeRequest !== requestId || !myActive) return;
'''
          new_fetch = '''      const payloads = await Promise.all(STATUS_ORDER.map((status) => {
        const params = new URLSearchParams({ status, limit: "100", region: titleRegion() });
        const query = searchInput.value.trim();
        if (query) params.set("q", query);
        return fetchMyShows(params);
      }));
      if (activeRequest !== requestId || !myActive) return;
'''
          replace_once('public/phase5-ui.js', old_fetch, new_fetch)

          replace_once('public/phase5-ui.js',
              '      emptyCopy.textContent = "追蹤清單仍保留在這個瀏覽器，可立即重新載入。";\n',
              '      emptyCopy.textContent = error?.name === "AbortError"\n        ? "連線等候超過 12 秒。追蹤清單仍保留在這個瀏覽器，可立即重新載入。"\n        : "追蹤清單仍保留在這個瀏覽器，可立即重新載入。";\n')

          replace_once('public/phase5-ui.js',
              '      if (retryViewButton) retryViewButton.hidden = false;\n    }\n  }',
              '      if (retryViewButton) retryViewButton.hidden = false;\n    } finally {\n      if (activeRequest === requestId && myActive) contentPanel?.setAttribute("aria-busy", "false");\n    }\n  }')

          replace_once('public/phase5b-ui.js',
              '  const emptyCopy = document.querySelector("#empty-copy");\n',
              '  const emptyCopy = document.querySelector("#empty-copy");\n  const emptyActions = document.querySelector("#empty-actions");\n  const retryViewButton = document.querySelector("#retry-view-button");\n')

          old_schedule_fetch = '''    const response = await fetch(`/api/schedule?${params}`, { cache: "no-store" });
    if (!response.ok) throw new Error(`Schedule ${response.status}`);
    const payload = await response.json();
    if (request !== requestId || !active) return null;
    return scheduleWindow(payload.data, today, days, browserTimeZone)
      .filter((episode) => matchesScheduleQuery(episode, searchInput.value.trim()));
'''
          new_schedule_fetch = '''    const controller = new AbortController();
    const timeout = window.setTimeout(() => controller.abort(), 12000);
    try {
      const response = await fetch(`/api/schedule?${params}`, { cache: "no-store", signal: controller.signal });
      if (!response.ok) throw new Error(`Schedule ${response.status}`);
      const payload = await response.json();
      if (request !== requestId || !active) return null;
      return scheduleWindow(payload.data, today, days, browserTimeZone)
        .filter((episode) => matchesScheduleQuery(episode, searchInput.value.trim()));
    } finally {
      window.clearTimeout(timeout);
    }
'''
          replace_once('public/phase5b-ui.js', old_schedule_fetch, new_schedule_fetch)

          replace_once('public/phase5b-ui.js',
              '    const view = activeView();\n    viewContext.textContent = `${snapshot.context} · 只顯示這個瀏覽器已追蹤的劇集。`;\n    try {',
              '    const view = activeView();\n    viewContext.textContent = `${snapshot.context} · 只顯示這個瀏覽器已追蹤的劇集。`;\n    if (emptyActions) emptyActions.hidden = true;\n    if (retryViewButton) retryViewButton.hidden = true;\n    try {')

          replace_once('public/phase5b-ui.js',
              '      emptyCopy.textContent = "一般今日／本週排程仍可使用；關閉「只看追蹤」即可返回。";\n',
              '      emptyCopy.textContent = error?.name === "AbortError"\n        ? "連線等候超過 12 秒。可立即重試，或關閉「只看追蹤」返回一般排程。"\n        : "一般今日／本週排程仍可使用；可立即重試，或關閉「只看追蹤」返回。";\n      if (emptyActions) emptyActions.hidden = false;\n      if (retryViewButton) retryViewButton.hidden = false;\n')

          replace_once('public/phase5b-ui.js',
              '  window.addEventListener("storage", (event) => {\n',
              '  window.addEventListener("series-hub:retry", () => {\n    if (active && isScheduleView()) applyTrackedFilter();\n  });\n\n  window.addEventListener("storage", (event) => {\n')

          Path('.github/workflows/phase5e-d1-polish-writer.yml').unlink()
          PY

      - name: Commit resilience polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/phase5-ui.js public/phase5b-ui.js .github/workflows/phase5e-d1-polish-writer.yml
          git diff --cached --check
          git commit -m "Phase 5E-D1: bound personalized view requests"
          git push origin HEAD:phase-5e-d1-ux-resilience
