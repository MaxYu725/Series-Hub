name: Apply Phase 5E-D1 UX resilience patch

on:
  push:
    branches:
      - phase-5e-d1-ux-resilience
    paths:
      - .github/workflows/phase5e-d1-writer.yml

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-5e-d1-ux-resilience

      - name: Patch frontend
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing anchor in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once('public/index.html',
              '  <link rel="stylesheet" href="/phase5d.css">\n',
              '  <link rel="stylesheet" href="/phase5d.css">\n  <link rel="stylesheet" href="/phase5e.css">\n')
          replace_once('public/index.html',
              '    <div class="phase-chip phase-4">Phase 5D-B</div>',
              '    <div class="phase-chip phase-4">Phase 5E-D</div>')
          replace_once('public/index.html',
              '追蹤與觀看狀態仍以目前瀏覽器為主；只有使用者日後主動開啟背景通知時，才會另外保存該裝置的 Push subscription 及選定劇集 ID，並可完整刪除。',
              '追蹤與觀看狀態仍以目前瀏覽器為主；只有使用者主動開啟通知時，才會另外保存該裝置的 Push subscription 及選定劇集 ID。有可靠逐集播映時間時可在約 24 小時前提醒，並可隨時完整刪除裝置訂閱。')
          replace_once('public/index.html',
              '    <section class="content-panel">',
              '    <section class="content-panel" aria-busy="true">')
          replace_once('public/index.html',
              '          <p id="empty-copy">稍後再檢查排程。</p>\n',
              '          <p id="empty-copy">稍後再檢查排程。</p>\n          <div class="empty-actions" id="empty-actions" hidden>\n            <button type="button" class="retry-button" id="retry-view-button">重新載入</button>\n          </div>\n')
          replace_once('public/index.html',
              '  <script type="module" src="/phase5d-ui.js"></script>\n',
              '  <script type="module" src="/phase5d-ui.js"></script>\n  <script type="module" src="/phase5e-ui.js"></script>\n')

          replace_once('public/app.js',
              '  titleRegion: storedTitleRegion(),\n  loading: false,\n  requestId: 0\n};',
              '  titleRegion: storedTitleRegion(),\n  loading: false,\n  error: null,\n  requestId: 0\n};')
          replace_once('public/app.js',
              'const viewTitle = document.querySelector("#view-title");\n',
              'const contentPanel = document.querySelector(".content-panel");\nconst viewTitle = document.querySelector("#view-title");\n')
          replace_once('public/app.js',
              'const emptyCopy = document.querySelector("#empty-copy");\n',
              'const emptyCopy = document.querySelector("#empty-copy");\nconst emptyActions = document.querySelector("#empty-actions");\nconst retryViewButton = document.querySelector("#retry-view-button");\n')

          render_anchor = 'function render() {\n  const view = views[state.view];'
          render_helpers = '''function createCatalogSkeleton() {
            const card = document.createElement("article");
            card.className = "loading-skeleton-card";
            card.setAttribute("aria-hidden", "true");
            const poster = document.createElement("div");
            poster.className = "loading-skeleton-poster";
            const lines = document.createElement("div");
            lines.className = "loading-skeleton-lines";
            for (const className of ["loading-skeleton-line", "loading-skeleton-line short", "loading-skeleton-line tiny"]) {
              const line = document.createElement("div");
              line.className = className;
              lines.append(line);
            }
            card.append(poster, lines);
            return card;
          }

          function createScheduleSkeletonRow() {
            const row = document.createElement("div");
            row.className = "loading-skeleton-row";
            row.setAttribute("aria-hidden", "true");
            const thumb = document.createElement("div");
            thumb.className = "loading-skeleton-thumb";
            const lines = document.createElement("div");
            lines.className = "loading-skeleton-lines";
            for (const className of ["loading-skeleton-line", "loading-skeleton-line short", "loading-skeleton-line tiny"]) {
              const line = document.createElement("div");
              line.className = className;
              lines.append(line);
            }
            const time = document.createElement("div");
            time.className = "loading-skeleton-time";
            row.append(thumb, lines, time);
            return row;
          }

          function renderLoadingPlaceholders(isSchedule) {
            if (!state.loading) return;
            if (isSchedule && state.episodes.length === 0) {
              const shell = document.createElement("div");
              shell.className = "loading-skeleton-list";
              for (let index = 0; index < 4; index += 1) shell.append(createScheduleSkeletonRow());
              scheduleList.replaceChildren(shell);
            } else if (!isSchedule && state.shows.length === 0) {
              showGrid.replaceChildren(...Array.from({ length: 6 }, createCatalogSkeleton));
            }
          }

          function render() {
            const view = views[state.view];'''
          replace_once('public/app.js', render_anchor, render_helpers)

          replace_once('public/app.js',
              '  showGrid.hidden = isSchedule;\n  scheduleList.hidden = !isSchedule;\n  showGrid.replaceChildren();\n  if (isSchedule) renderSchedule();\n  else for (const show of state.shows) showGrid.append(createShowCard(show));\n\n  const count = isSchedule ? state.episodes.length : state.shows.length;\n  showCount.textContent = state.loading ? "載入中…" : isSchedule ? `${count} 集` : `${count} 套`;\n  const isEmpty = !state.loading && count === 0;\n  emptyState.hidden = !isEmpty;\n\n  if (!isEmpty) return;\n',
              '  contentPanel?.setAttribute("aria-busy", String(state.loading));\n  emptyState.removeAttribute("data-state");\n  emptyActions.hidden = true;\n  retryViewButton.hidden = true;\n  showGrid.hidden = isSchedule;\n  scheduleList.hidden = !isSchedule;\n  showGrid.replaceChildren();\n  if (isSchedule) renderSchedule();\n  else for (const show of state.shows) showGrid.append(createShowCard(show));\n  renderLoadingPlaceholders(isSchedule);\n\n  const count = isSchedule ? state.episodes.length : state.shows.length;\n  showCount.textContent = state.loading ? "載入中…" : isSchedule ? `${count} 集` : `${count} 套`;\n  if (state.loading) {\n    emptyState.hidden = true;\n    return;\n  }\n\n  if (state.error) {\n    emptyState.hidden = false;\n    emptyState.dataset.state = "error";\n    emptyTitle.textContent = isSchedule ? "排程暫時無法載入" : "劇集暫時無法載入";\n    emptyCopy.textContent = state.error === "timeout"\n      ? "連線等候超過 12 秒。可立即重試；追蹤及追劇狀態不受影響。"\n      : "網絡或 API 暫時無法回應。可立即重試；本機追蹤資料不會被清除。";\n    emptyActions.hidden = false;\n    retryViewButton.hidden = false;\n    return;\n  }\n\n  const isEmpty = count === 0;\n  emptyState.hidden = !isEmpty;\n\n  if (!isEmpty) return;\n')

          replace_once('public/app.js',
              'async function loadCatalog(view, requestId) {',
              '''async function fetchJson(url, label, timeoutMs = 12000) {
            const controller = new AbortController();
            const timeout = window.setTimeout(() => controller.abort(), timeoutMs);
            try {
              const response = await fetch(url, { cache: "no-store", signal: controller.signal });
              if (!response.ok) throw new Error(`${label} ${response.status}`);
              return await response.json();
            } finally {
              window.clearTimeout(timeout);
            }
          }

          async function loadCatalog(view, requestId) {''')
          replace_once('public/app.js',
              '  const response = await fetch(`/api/shows?${params}`, { cache: "no-store" });\n  if (!response.ok) throw new Error(`Shows ${response.status}`);\n  const payload = await response.json();\n',
              '  const payload = await fetchJson(`/api/shows?${params}`, "Shows");\n')
          replace_once('public/app.js',
              '  const response = await fetch(`/api/schedule?${params}`, { cache: "no-store" });\n  if (!response.ok) throw new Error(`Schedule ${response.status}`);\n  const payload = await response.json();\n',
              '  const payload = await fetchJson(`/api/schedule?${params}`, "Schedule");\n')
          replace_once('public/app.js',
              '  const view = views[state.view];\n  state.loading = true;\n  render();\n\n  try {',
              '  const view = views[state.view];\n  state.loading = true;\n  state.error = null;\n  render();\n\n  try {')
          replace_once('public/app.js',
              '    console.error(error);\n    state.shows = [];\n    state.episodes = [];\n    setHealth("error", view.type === "schedule" ? "排程 API 暫時無法讀取" : "劇集 API 暫時無法讀取");',
              '    console.error(error);\n    state.shows = [];\n    state.episodes = [];\n    state.error = error?.name === "AbortError" ? "timeout" : "request";\n    setHealth("error", view.type === "schedule" ? "排程 API 暫時無法讀取" : "劇集 API 暫時無法讀取");')
          replace_once('public/app.js',
              '      state.loading = false;\n      render();\n',
              '      state.loading = false;\n      render();\n      if (!state.error && statusDot.classList.contains("error")) loadSystemStatus();\n')
          replace_once('public/app.js',
              'document.querySelectorAll(".filter").forEach((button) => {',
              'window.addEventListener("series-hub:retry", (event) => {\n  if (event?.detail?.view === "my-shows") return;\n  state.shows = [];\n  state.episodes = [];\n  loadCurrentView();\n});\n\ndocument.querySelectorAll(".filter").forEach((button) => {')

          replace_once('public/phase5-ui.js',
              '  const emptyCopy = document.querySelector("#empty-copy");\n',
              '  const emptyCopy = document.querySelector("#empty-copy");\n  const emptyActions = document.querySelector("#empty-actions");\n  const retryViewButton = document.querySelector("#retry-view-button");\n')
          replace_once('public/phase5-ui.js',
              '    emptyState.hidden = true;\n    showCount.textContent = "載入中…";\n',
              '    emptyState.hidden = true;\n    if (emptyActions) emptyActions.hidden = true;\n    if (retryViewButton) retryViewButton.hidden = true;\n    showCount.textContent = "載入中…";\n')
          replace_once('public/phase5-ui.js',
              '      emptyCopy.textContent = "追蹤清單仍保留在這個瀏覽器，稍後重新開啟即可。";\n',
              '      emptyCopy.textContent = "追蹤清單仍保留在這個瀏覽器，可立即重新載入。";\n      if (emptyActions) emptyActions.hidden = false;\n      if (retryViewButton) retryViewButton.hidden = false;\n')
          replace_once('public/phase5-ui.js',
              '  const observer = new MutationObserver(() => {\n',
              '  window.addEventListener("series-hub:retry", (event) => {\n    if (event?.detail?.view === "my-shows" && myActive) loadMyShows();\n  });\n\n  const observer = new MutationObserver(() => {\n')

          Path('.github/workflows/phase5e-d1-writer.yml').unlink()
          PY

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/app.js public/phase5-ui.js .github/workflows/phase5e-d1-writer.yml
          git diff --cached --check
          git commit -m "Phase 5E-D1: harden mobile loading and navigation UX"
          git push origin HEAD:phase-5e-d1-ux-resilience
