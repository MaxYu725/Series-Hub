name: Phase 5E-B branch patch

on:
  push:
    branches:
      - phase-5e-b-catalog-rotation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase-5e-b-catalog-rotation

      - name: Apply patch and run tests
        shell: bash
        run: |
          set -euo pipefail
          python scripts/phase5e-b-patch.py
          npm test

      - name: Commit patch if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Phase 5E-B patch is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tmdb.js test/phase1b-policy.test.js
          git commit -m "Phase 5E-B: rotate TMDB candidate slices"
          git push origin HEAD:phase-5e-b-catalog-rotation
