name: Phase 0 Cloudflare bootstrap

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: phase0-cloudflare-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ID }}
      WRANGLER_VERSION: "4.125.0"
      D1_NAME: "series-hub-db"

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Validate Cloudflare credentials are present
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CF_API secret is missing"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CF_ID secret is missing"; exit 1; }

      - name: Resolve or create D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail

          list_databases() {
            npx --yes wrangler@"${WRANGLER_VERSION}" d1 list --json
          }

          DATABASES="$(list_databases)"
          DB_ID="$(printf '%s' "${DATABASES}" | jq -r --arg name "${D1_NAME}" '.[] | select(.name == $name) | .uuid' | head -n 1)"

          if [ -z "${DB_ID}" ] || [ "${DB_ID}" = "null" ]; then
            echo "Creating ${D1_NAME} in APAC"
            npx --yes wrangler@"${WRANGLER_VERSION}" d1 create "${D1_NAME}" --location apac
            DATABASES="$(list_databases)"
            DB_ID="$(printf '%s' "${DATABASES}" | jq -r --arg name "${D1_NAME}" '.[] | select(.name == $name) | .uuid' | head -n 1)"
          else
            echo "Reusing existing ${D1_NAME}"
          fi

          test -n "${DB_ID}" && test "${DB_ID}" != "null"
          echo "database_id=${DB_ID}" >> "${GITHUB_OUTPUT}"
          echo "D1 database id: ${DB_ID}"

      - name: Configure D1 binding in validation worktree
        run: node scripts/configure-d1.mjs "${{ steps.d1.outputs.database_id }}"

      - name: Apply D1 migrations
        run: npx --yes wrangler@"${WRANGLER_VERSION}" d1 migrations apply "${D1_NAME}" --remote

      - name: Verify migrated schema
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@"${WRANGLER_VERSION}" d1 execute "${D1_NAME}" --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('shows','seasons','episodes','title_aliases','providers','availability','sources','sync_runs') ORDER BY name;"

      - name: Validate Worker build without production deployment
        run: npx --yes wrangler@"${WRANGLER_VERSION}" deploy --dry-run --outdir .wrangler-dry-run

      - name: Upload non-production Worker version
        run: npx --yes wrangler@"${WRANGLER_VERSION}" versions upload --message "Phase 0 D1 validation for PR #${{ github.event.pull_request.number }}"

      - name: Publish bootstrap result
        shell: bash
        run: |
          {
            echo "## Phase 0 Cloudflare bootstrap"
            echo
            echo "- D1 database: \`${D1_NAME}\`"
            echo "- Database ID: \`${{ steps.d1.outputs.database_id }}\`"
            echo "- Migration: applied/verified"
            echo "- Worker: dry-run validated"
            echo "- Preview version: uploaded without production traffic"
          } >> "${GITHUB_STEP_SUMMARY}"
