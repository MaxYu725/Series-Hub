name: Cloudflare validation and deploy

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  WRANGLER_VERSION: "4.125.0"
  PRODUCTION_URL: "https://series-hub.max-yu-jp.workers.dev"

jobs:
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ID }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CF_API secret is missing"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CF_ID secret is missing"; exit 1; }

      - name: Validate Worker build
        run: npx --yes wrangler@"${WRANGLER_VERSION}" deploy --dry-run --outdir .wrangler-dry-run

      - name: Upload isolated preview version
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          ALIAS="pr-${{ github.event.pull_request.number }}"
          OUTPUT="$(npx --yes wrangler@"${WRANGLER_VERSION}" versions upload \
            --preview-alias "${ALIAS}" \
            --message "PR ${{ github.event.pull_request.number }} validation" 2>&1)"
          printf '%s\n' "${OUTPUT}"
          PREVIEW_URL="$(printf '%s\n' "${OUTPUT}" | grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' | tail -n 1)"
          test -n "${PREVIEW_URL}" || { echo "Preview URL was not returned by Wrangler"; exit 1; }
          echo "url=${PREVIEW_URL}" >> "${GITHUB_OUTPUT}"

      - name: Smoke-test preview runtime
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_JSON="$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "${PREVIEW_URL}/health")"
          SHOWS_JSON="$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "${PREVIEW_URL}/api/shows")"

          HEALTH_JSON="${HEALTH_JSON}" node -e '
            const data = JSON.parse(process.env.HEALTH_JSON);
            if (data.ok !== true || data.databaseConfigured !== true || data.databaseReachable !== true) {
              console.error("Preview health failed:", data);
              process.exit(1);
            }
          '

          SHOWS_JSON="${SHOWS_JSON}" node -e '
            const data = JSON.parse(process.env.SHOWS_JSON);
            if (!Array.isArray(data.data)) {
              console.error("Preview shows API failed:", data);
              process.exit(1);
            }
          '

      - name: Smoke-test production runtime
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_JSON="$(curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 "${PRODUCTION_URL}/health")"
          SHOWS_JSON="$(curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 "${PRODUCTION_URL}/api/shows")"

          HEALTH_JSON="${HEALTH_JSON}" node -e '
            const data = JSON.parse(process.env.HEALTH_JSON);
            if (data.ok !== true || data.databaseConfigured !== true || data.databaseReachable !== true) {
              console.error("Production health failed:", data);
              process.exit(1);
            }
          '

          SHOWS_JSON="${SHOWS_JSON}" node -e '
            const data = JSON.parse(process.env.SHOWS_JSON);
            if (!Array.isArray(data.data)) {
              console.error("Production shows API failed:", data);
              process.exit(1);
            }
          '

      - name: Publish validation summary
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        shell: bash
        run: |
          {
            echo "## Cloudflare PR validation"
            echo
            echo "- Worker dry-run: passed"
            echo "- Preview runtime: passed"
            echo "- Preview URL: ${PREVIEW_URL}"
            echo "- Production regression check: passed"
            echo "- D1 binding/reachability: passed"
          } >> "${GITHUB_STEP_SUMMARY}"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ID }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CF_API secret is missing"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CF_ID secret is missing"; exit 1; }

      - name: Deploy main to production
        run: npx --yes wrangler@"${WRANGLER_VERSION}" deploy

      - name: Verify production runtime
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_JSON="$(curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 "${PRODUCTION_URL}/health")"
          SHOWS_JSON="$(curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 "${PRODUCTION_URL}/api/shows")"

          HEALTH_JSON="${HEALTH_JSON}" node -e '
            const data = JSON.parse(process.env.HEALTH_JSON);
            if (data.ok !== true || data.databaseConfigured !== true || data.databaseReachable !== true) {
              console.error("Production health failed:", data);
              process.exit(1);
            }
          '

          SHOWS_JSON="${SHOWS_JSON}" node -e '
            const data = JSON.parse(process.env.SHOWS_JSON);
            if (!Array.isArray(data.data)) {
              console.error("Production shows API failed:", data);
              process.exit(1);
            }
          '
