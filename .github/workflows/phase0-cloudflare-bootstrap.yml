name: Cloudflare validation and deploy

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, closed]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  WRANGLER_VERSION: "4.125.0"
  PRODUCTION_URL: "https://series-hub.max-yu-jp.workers.dev"
  PRODUCTION_DB_NAME: "series-hub-db"

jobs:
  preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ID }}
      PREVIEW_DB_NAME: series-hub-pr-${{ github.event.pull_request.number }}
      PREVIEW_WORKER_NAME: series-hub-pr-${{ github.event.pull_request.number }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Run unit tests
        run: npm test

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CF_API secret is missing"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CF_ID secret is missing"; exit 1; }

      - name: Resolve isolated preview D1
        id: preview_db
        shell: bash
        run: |
          set -euo pipefail
          DATABASES="$(npx --yes wrangler@"${WRANGLER_VERSION}" d1 list --json)"
          DB_ID="$(printf '%s' "${DATABASES}" | jq -r --arg name "${PREVIEW_DB_NAME}" '.[] | select(.name == $name) | .uuid' | head -n 1)"

          if [ -z "${DB_ID}" ] || [ "${DB_ID}" = "null" ]; then
            npx --yes wrangler@"${WRANGLER_VERSION}" d1 create "${PREVIEW_DB_NAME}" --location apac
            DATABASES="$(npx --yes wrangler@"${WRANGLER_VERSION}" d1 list --json)"
            DB_ID="$(printf '%s' "${DATABASES}" | jq -r --arg name "${PREVIEW_DB_NAME}" '.[] | select(.name == $name) | .uuid' | head -n 1)"
          fi

          test -n "${DB_ID}" && test "${DB_ID}" != "null"
          echo "database_id=${DB_ID}" >> "${GITHUB_OUTPUT}"

      - name: Configure fully isolated preview Worker
        env:
          PREVIEW_DB_ID: ${{ steps.preview_db.outputs.database_id }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'wrangler.jsonc';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          const binding = config.d1_databases?.find((item) => item.binding === 'DB');
          if (!binding) throw new Error('DB binding is missing from wrangler.jsonc');
          config.name = process.env.PREVIEW_WORKER_NAME;
          binding.database_name = process.env.PREVIEW_DB_NAME;
          binding.database_id = process.env.PREVIEW_DB_ID;
          config.triggers = { crons: [] };
          delete config.secrets;
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Apply migrations to isolated preview D1
        run: npx --yes wrangler@"${WRANGLER_VERSION}" d1 migrations apply "${PREVIEW_DB_NAME}" --remote

      - name: Validate Worker build
        run: npx --yes wrangler@"${WRANGLER_VERSION}" deploy --dry-run --outdir .wrangler-dry-run

      - name: Deploy isolated preview Worker
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$(npx --yes wrangler@"${WRANGLER_VERSION}" deploy 2>&1)"
          printf '%s\n' "${OUTPUT}"
          PREVIEW_URL="$(printf '%s\n' "${OUTPUT}" | grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' | tail -n 1)"
          test -n "${PREVIEW_URL}" || { echo "Preview URL was not returned by Wrangler"; exit 1; }
          echo "url=${PREVIEW_URL}" >> "${GITHUB_OUTPUT}"

      - name: Smoke-test preview runtime
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_JSON=""
          for attempt in $(seq 1 20); do
            if HEALTH_JSON="$(curl --fail --silent --show-error "${PREVIEW_URL}/health" 2>/dev/null)"; then
              break
            fi
            echo "Preview not ready yet (${attempt}/20)"
            sleep 3
          done
          test -n "${HEALTH_JSON}" || { echo "Preview /health did not become ready"; exit 1; }

          SHOWS_JSON="$(curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 "${PREVIEW_URL}/api/shows?status=airing")"
          SCHEDULE_JSON="$(curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 "${PREVIEW_URL}/api/schedule?days=7")"
          SYNC_JSON="$(curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 "${PREVIEW_URL}/api/sync-status?source=tvmaze")"

          HEALTH_JSON="${HEALTH_JSON}" node -e '
            const data = JSON.parse(process.env.HEALTH_JSON);
            if (data.ok !== true || data.databaseConfigured !== true || data.databaseReachable !== true) {
              console.error("Preview health failed:", data);
              process.exit(1);
            }
            if (data.phase !== "3-regional-titles" || data.tmdbConfigured !== false || data.tvmazeEnabled !== true) {
              console.error("Preview must be Phase 3 with no production TMDB secret:", data);
              process.exit(1);
            }
          '

          SHOWS_JSON="${SHOWS_JSON}" SCHEDULE_JSON="${SCHEDULE_JSON}" SYNC_JSON="${SYNC_JSON}" node -e '
            const shows = JSON.parse(process.env.SHOWS_JSON);
            const schedule = JSON.parse(process.env.SCHEDULE_JSON);
            const sync = JSON.parse(process.env.SYNC_JSON);
            if (!Array.isArray(shows.data) || shows.meta?.phase !== "3-regional-titles") process.exit(1);
            if (!Array.isArray(schedule.data) || schedule.meta?.phase !== "3-regional-titles") process.exit(1);
            if (!("data" in sync) || sync.meta?.source !== "tvmaze") process.exit(1);
          '

      - name: Smoke-test production runtime
        shell: bash
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "${TMP_DIR}"' EXIT
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 "${PRODUCTION_URL}/health" -o "${TMP_DIR}/health.json"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 "${PRODUCTION_URL}/api/shows" -o "${TMP_DIR}/shows.json"

          node - "${TMP_DIR}" <<'NODE'
          const fs = require('fs');
          const dir = process.argv[2];
          const health = JSON.parse(fs.readFileSync(`${dir}/health.json`, 'utf8'));
          const shows = JSON.parse(fs.readFileSync(`${dir}/shows.json`, 'utf8'));
          if (health.ok !== true || health.databaseConfigured !== true || health.databaseReachable !== true) process.exit(1);
          if (!["2-tvmaze-schedule", "3-regional-titles"].includes(health.phase)) process.exit(1);
          if (!Array.isArray(shows.data)) process.exit(1);
          NODE

      - name: Publish validation summary
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        shell: bash
        run: |
          {
            echo "## Cloudflare PR validation"
            echo
            echo "- Unit tests: passed"
            echo "- Preview Worker: ${PREVIEW_WORKER_NAME} (isolated)"
            echo "- Preview D1: ${PREVIEW_DB_NAME} (isolated)"
            echo "- Production secrets inherited by preview: no"
            echo "- Phase 3 regional-title API: passed"
            echo "- Preview URL: ${PREVIEW_URL}"
            echo "- Production regression check: passed"
          } >> "${GITHUB_STEP_SUMMARY}"

  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ID }}
      PREVIEW_DB_NAME: series-hub-pr-${{ github.event.pull_request.number }}
      PREVIEW_WORKER_NAME: series-hub-pr-${{ github.event.pull_request.number }}

    steps:
      - name: Delete isolated preview Worker
        shell: bash
        run: |
          set +e
          npx --yes wrangler@"${WRANGLER_VERSION}" delete --name "${PREVIEW_WORKER_NAME}"
          exit 0

      - name: Delete isolated preview D1
        shell: bash
        run: |
          set -euo pipefail
          DATABASES="$(npx --yes wrangler@"${WRANGLER_VERSION}" d1 list --json)"
          DB_ID="$(printf '%s' "${DATABASES}" | jq -r --arg name "${PREVIEW_DB_NAME}" '.[] | select(.name == $name) | .uuid' | head -n 1)"
          if [ -n "${DB_ID}" ] && [ "${DB_ID}" != "null" ]; then
            npx --yes wrangler@"${WRANGLER_VERSION}" d1 delete "${PREVIEW_DB_NAME}" --skip-confirmation
          else
            echo "Preview D1 ${PREVIEW_DB_NAME} is already absent"
          fi

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ID }}
      TMDB_API_TOKEN: ${{ secrets.TMDB_API }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Run unit tests
        run: npm test

      - name: Validate production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CF_API secret is missing"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CF_ID secret is missing"; exit 1; }
          test -n "${TMDB_API_TOKEN:-}" || { echo "TMDB_API repository secret is missing; production deployment is blocked"; exit 1; }

      - name: Apply production D1 migrations
        run: npx --yes wrangler@"${WRANGLER_VERSION}" d1 migrations apply "${PRODUCTION_DB_NAME}" --remote

      - name: Bootstrap production TMDB secret
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('.tmdb-secrets.json', JSON.stringify({ TMDB_API_TOKEN: process.env.TMDB_API_TOKEN }));
          NODE
          trap 'rm -f .tmdb-secrets.json' EXIT
          npx --yes wrangler@"${WRANGLER_VERSION}" secret bulk .tmdb-secrets.json --name series-hub
          SECRET_LIST="$(npx --yes wrangler@"${WRANGLER_VERSION}" secret list --name series-hub)"
          printf '%s' "${SECRET_LIST}" | jq -e '.[] | select(.name == "TMDB_API_TOKEN")' >/dev/null

      - name: Deploy main to production
        run: npx --yes wrangler@"${WRANGLER_VERSION}" deploy

      - name: Verify Phase 3 runtime before sync
        shell: bash
        run: |
          set -euo pipefail
          READY=0
          for attempt in $(seq 1 20); do
            if HEALTH_JSON="$(curl --fail --silent --show-error "${PRODUCTION_URL}/health" 2>/dev/null)"; then
              if HEALTH_JSON="${HEALTH_JSON}" node -e '
                const data = JSON.parse(process.env.HEALTH_JSON);
                process.exit(data.ok === true && data.phase === "3-regional-titles" && data.tmdbConfigured === true && data.tvmazeEnabled === true ? 0 : 1);
              '; then
                READY=1
                break
              fi
            fi
            echo "Production Phase 3 runtime not ready yet (${attempt}/20)"
            sleep 3
          done
          test "${READY}" -eq 1 || { echo "Production Worker did not become Phase 3 ready"; exit 1; }

      - name: Derive internal sync key
        id: sync_key
        shell: bash
        run: |
          set -euo pipefail
          SYNC_KEY="$(node -e '
            const crypto = require("crypto");
            process.stdout.write(crypto.createHash("sha256").update("series-hub:tmdb-sync:v2:" + process.env.TMDB_API_TOKEN).digest("hex"));
          ')"
          echo "::add-mask::${SYNC_KEY}"
          echo "key=${SYNC_KEY}" >> "${GITHUB_OUTPUT}"

      - name: Run immediate TMDB catalog sync
        env:
          SYNC_KEY: ${{ steps.sync_key.outputs.key }}
        shell: bash
        run: |
          set -euo pipefail
          SYNC_JSON="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 -X POST -H "x-series-hub-sync-key: ${SYNC_KEY}" "${PRODUCTION_URL}/api/internal/tmdb-sync")"
          SYNC_JSON="${SYNC_JSON}" node -e '
            const data = JSON.parse(process.env.SYNC_JSON);
            if (data.ok !== true || Number(data.recordsChanged || 0) < 1) {
              console.error("TMDB bootstrap sync failed:", data);
              process.exit(1);
            }
            console.log(`TMDB sync accepted ${data.recordsChanged} shows from ${data.recordsSeen} candidates`);
          '

      - name: Bootstrap TVmaze mappings and episodes
        env:
          SYNC_KEY: ${{ steps.sync_key.outputs.key }}
        shell: bash
        run: |
          set -euo pipefail
          TOTAL_PROCESSED=0
          TOTAL_EPISODES=0
          for pass in 1 2 3; do
            SYNC_JSON="$(curl --fail --silent --show-error --retry 2 --retry-all-errors --retry-delay 3 -X POST -H "x-series-hub-sync-key: ${SYNC_KEY}" "${PRODUCTION_URL}/api/internal/tvmaze-sync")"
            printf '%s\n' "TVmaze pass ${pass}: ${SYNC_JSON}"
            RESULT="$(SYNC_JSON="${SYNC_JSON}" node -e '
              const data = JSON.parse(process.env.SYNC_JSON);
              if (data.ok !== true) process.exit(1);
              process.stdout.write(`${Number(data.showsProcessed || 0)} ${Number(data.recordsChanged || 0)}`);
            ')"
            TOTAL_PROCESSED=$((TOTAL_PROCESSED + ${RESULT%% *}))
            TOTAL_EPISODES=$((TOTAL_EPISODES + ${RESULT##* }))
          done
          test "${TOTAL_PROCESSED}" -gt 0 || { echo "TVmaze did not process any mapped shows"; exit 1; }
          test "${TOTAL_EPISODES}" -gt 0 || { echo "TVmaze did not normalize any episodes"; exit 1; }
          echo "TVmaze bootstrap processed ${TOTAL_PROCESSED} show passes and normalized ${TOTAL_EPISODES} episode rows"

      - name: Verify production runtime
        shell: bash
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "${TMP_DIR}"' EXIT
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 "${PRODUCTION_URL}/health" -o "${TMP_DIR}/health.json"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 "${PRODUCTION_URL}/api/shows?limit=60" -o "${TMP_DIR}/shows.json"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 "${PRODUCTION_URL}/api/schedule?days=14" -o "${TMP_DIR}/schedule.json"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 "${PRODUCTION_URL}/api/sync-status?source=tmdb" -o "${TMP_DIR}/tmdb.json"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 "${PRODUCTION_URL}/api/sync-status?source=tvmaze" -o "${TMP_DIR}/tvmaze.json"

          node - "${TMP_DIR}" <<'NODE'
          const fs = require('fs');
          const dir = process.argv[2];
          const read = (name) => JSON.parse(fs.readFileSync(`${dir}/${name}.json`, 'utf8'));
          const health = read('health');
          const shows = read('shows');
          const schedule = read('schedule');
          const tmdb = read('tmdb');
          const tvmaze = read('tvmaze');
          if (health.ok !== true || health.phase !== "3-regional-titles" || health.tmdbConfigured !== true || health.tvmazeEnabled !== true) process.exit(1);
          if (!Array.isArray(shows.data) || shows.meta?.phase !== "3-regional-titles" || shows.data.length < 1) process.exit(1);
          if (!Array.isArray(schedule.data) || schedule.meta?.source !== "TVmaze") process.exit(1);
          if (!tmdb.data || !["success", "success_with_warnings"].includes(tmdb.data.status)) process.exit(1);
          if (!tvmaze.data || !["success", "success_with_warnings"].includes(tvmaze.data.status) || Number(tvmaze.data.records_changed || 0) < 1) process.exit(1);
          NODE
