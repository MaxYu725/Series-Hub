name: Phase 3 final health stage

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  stage:
    if: github.head_ref == 'phase-3-finalize' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3-finalize
      - name: Stage corrected deploy workflow blob
        shell: python
        run: |
          from pathlib import Path
          source = Path('.github/workflows/phase0-cloudflare-bootstrap.yml').read_text()
          old = 'if (health.ok !== true || health.phase !== "2-tvmaze-schedule" || health.tmdbConfigured !== true || health.tvmazeEnabled !== true) process.exit(1);'
          new = 'if (health.ok !== true || health.phase !== "3-regional-titles" || health.tmdbConfigured !== true || health.tvmazeEnabled !== true) process.exit(1);'
          if source.count(old) != 1:
              raise RuntimeError(f'expected exactly one final production health assertion, got {source.count(old)}')
          Path('phase3-final-health-workflow.yml').write_text(source.replace(old, new, 1))
      - name: Commit staged blob
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase3-final-health-workflow.yml
          git diff --cached --check
          git commit -m "fix: stage final Phase 3 health assertion"
          git push origin HEAD:phase-3-finalize
