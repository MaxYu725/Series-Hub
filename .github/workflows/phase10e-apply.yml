name: Phase 10E apply patch

on:
  push:
    branches:
      - phase10e-korea-catalog-coverage

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply Phase 10E source, tests and docs
        shell: bash
        run: node .phase10e-apply.cjs

      - name: Run unit tests
        shell: bash
        run: npm test

      - name: Commit formal Phase 10E patch and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MaxYu725"
          git config user.email "maxyu0725@outlook.com"
          git rm .github/workflows/phase10e-apply.yml .phase10e-apply.cjs
          git add src/tmdb-korea.js src/tmdb-korea-quality.js test/phase10b1-korea-schedule-priority.test.js test/phase10e-korea-coverage.test.js docs/PHASE10E_KOREA_COVERAGE.md docs/PHASE10_KOREA.md
          git commit -m "Phase 10E: expand Korean catalog coverage"
          git push origin HEAD:phase10e-korea-catalog-coverage
